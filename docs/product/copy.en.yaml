metadata:
  source: 'docs/product/brief.md, docs/product/prd.md, conversation'
  created: '2026-06-06'
  updated: '2026-09-28'
  version: '1.0.14'
  status: 'ready'

project:
  name: 'adeonir.dev'
  language: 'en'
  industry: 'portfolio'
  title: 'Adeonir Kohl | Frontend Engineer'
  description: "I'm a design engineer working on the frontend, taking care of every detail of accessible, responsive, fast web interfaces."

intent:
  status: confirmed
  purpose: 'Present Adeonir, his work, and how he builds interfaces so clients, recruiters, and peers can evaluate him and get in touch.'
  reader_goal: 'Understand who Adeonir is, evaluate his work, and find a way to get in touch.'
  function: 'brand/editorial'
  constraints:
    - 'Lead with the work; contact is a secondary action.'
    - 'Use a personal, casual, clear voice without marketing language.'
    - 'Back the combination of design and code with specific facts, not adjectives. Proof through the work arrives with the timeline and projects sections.'
    - 'Forms, states, and navigation may use clear product/UX language while keeping the personal, informal tone.'

voice:
  status: confirmed
  line: 'Personal, casual, clear, and warm, with understated humor.'
  axes:
    formal_casual: casual
    reserved_bold: measured
    earnest_dry: earnest
    plain_playful: plain with occasional playfulness
  avoid:
    - 'Marketing language and generic adjectives.'
    - 'Designer and developer in equal parts.'

routes:
  home:
    title: 'Frontend Engineer'
  not-found:
    title: 'Page not found'
  maintenance:
    title: 'Maintenance'

# The content tree covers the surfaces home, projects, project, plus a global not-found (404) error surface. Header and footer are persistent across every surface.

content:
  home:
    agentDocument:
      sections:
        hero: 'Hero'
        about: 'About me'
        projects: 'Projects'
        expertise: 'Capabilities'
        contact: 'Contact'
    header: &header
      logo:
        text: 'adeonir.dev'
      nav:
        - text: 'projects'
        - text: 'about'
        - text: 'contact'
      menu:
        label: 'Menu'
        open: 'Open menu'
        close: 'Close menu'

    hero:
      eyebrow: 'Frontend Engineer'
      display: 'Adeonir Kohl'
      tagline: 'Design happens in code too.'
      description: "I'm a design engineer working on the frontend, taking care of every detail of the interface."
      availability: 'Available for work'
      actions:
        primary: 'See my projects'
        secondary: 'Get in touch'

    about:
      eyebrow: 'About me'
      headline: 'From design to code'
      body: 'Who I am, where I come from, and what I do.'
      bio:
        - "Hi, I'm Adeonir, and I like building things for the internet. As a frontend and design engineer, I'm looking for my next opportunity. I explore ideas through prototypes, create functional and accessible interfaces, build component libraries and design systems. I especially enjoy working at the intersection of design and code, always with an eye for detail."
        - 'After more than a decade as a graphic designer working on advertising materials, books, and magazines, I moved into frontend development. Day to day, I work mainly with React, TypeScript, Next.js, and Tailwind, and I use AI agents like Claude Code and Codex across the whole cycle, from specs and planning to implementation and review. I work in English at a professional level and have collaborated with teams in Europe and the US.'
        - 'Outside of work, I build a few personal projects where I design the interface and define the architecture, and get to practice backend and mobile development too.'
        - 'In my spare time, I like spending time with family, collecting Hot Wheels with my son, watching TV shows and movies, and hanging out with friends.'

    projects:
      eyebrow: 'Featured projects'
      headline: 'Ideas that went live'
      body: 'A few projects I helped build over the last years.'
      empty: "I don't have a featured project published here yet. If you want to know what I'm working on, send me a message."
      see-all: 'See all projects'

    expertise:
      eyebrow: 'Capabilities'
      headline: 'What I do'
      body: 'Day to day, I work with teams to build interfaces.'
      items:
        - title: 'Artificial intelligence'
          description: 'I use AI agents to plan solutions, create prototypes, and test code. I also integrate AI features into products, like the audio narration on this site.'
        - title: 'Design systems'
          description: "I keep the component library organized and documented, so the team can build new screens to the same standard without rewriting what's already there."
        - title: 'Accessible interfaces'
          description: 'I work on accessibility from the first component, so the interface also works with keyboard navigation or a screen reader.'
        - title: 'Performance'
          description: 'I care about how each screen performs, especially how long it takes to load and how it responds to interactions.'

    contact:
      eyebrow: "Let's talk"
      headline: 'Send me a message'
      body: 'It can be about development, a project, or just to say hi.'
      social:
        - platform: 'email'
          label: 'contato@adeonir.dev'
          link: 'mailto:contato@adeonir.dev'
        - platform: 'github'
          label: 'github.com/adeonir'
          link: 'https://github.com/adeonir'
        - platform: 'linkedin'
          label: 'linkedin.com/in/adeonir'
          link: 'https://www.linkedin.com/in/adeonir'
        - platform: 'x'
          label: 'x.com/adeonir'
          link: 'https://x.com/adeonir'
      form:
        fields:
          - name: 'name'
            label: 'Name'
            placeholder: 'Your name'
          - name: 'email'
            label: 'Email'
            placeholder: 'you@example.com'
          - name: 'subject'
            label: 'Subject'
            placeholder: 'What do you want to talk about?'
          - name: 'message'
            label: 'Message'
            placeholder: 'Tell me more about what you have in mind.'
        submit: 'Send'
        states:
          success:
            title: 'Message sent'
            description: "Thanks! I'll be in touch soon."
          error:
            title: "We couldn't send your message"
            description: 'Try again or email me directly.'
        validation:
          required: 'This field is required.'
          email: 'Enter a valid email address.'
          maxLength: 'Use {max} characters or fewer.'

    narration:
      label: 'Listen'
      names:
        hero: 'Listen to the introduction'
        about: 'Listen to the about me section'
        expertise: 'Listen to the capabilities section'
      error:
        title: "We couldn't play the narration"
        description: 'Try again in a moment.'

    footer: &footer
      brand:
        text: 'adeonir.dev'
        copyright: '© 2026 Adeonir Kohl'
      signoff: 'Built with care, coffee, and beer.'
      reveals:
        - word: 'coffee'
          phrase: 'Coffee to get things done'
        - word: 'beer'
          phrase: 'Beer to celebrate'

  projects:
    header: *header
    page-header:
      headline: 'All projects'
      subheadline: 'Sites I built for clients, for my family, and for myself.'
    links:
      more: 'See more'
      external: '{domain}'
      offline: 'Offline'
    states:
      empty: "No project published yet. I'm working on something, and it'll show up here soon."
    footer: *footer

  project:
    header: *header
    back: 'All projects'
    meta:
      launch: 'Launch'
      role: 'Role'
      stack: 'Stack'
      link: 'Link'
    body: {}
    nav:
      previous: 'Previous project'
      next: 'Next project'
    # not-found -> content.not-found.paths.projects
    footer: *footer

  not-found:
    header: *header
    display: '404'
    headline: 'Page not found'
    body:
      - "This page doesn't exist or has moved."
    cta: 'Back to home'
    paths:
      projects:
        body:
          - "That project doesn't exist. Go back to all projects."
        cta: 'Back to projects'
    footer: *footer

# Hidden dev-console greeting — logged once per page load, not a routed surface.
console:
  greeting: "Hi, you're backstage now. If you find a bug, email me at contato@adeonir.dev"

# Transactional emails — not a routed surface. Sent on contact form submit.
# Tokens: {name} = sender's name (first name in body), {date} = received timestamp, {subject} = submitted subject (notification subject line).
# Recap/table field values come from the submission, not copy.
emails:
  from: 'Adeonir'
  confirmation:
    subject: 'Got your message'
    preview: "I'll reply as soon as I can."
    heading: 'Your message was sent'
    body: "Hi, {name}! Thanks for reaching out. I got your message and I'll reply as soon as I can."
    recap:
      label: 'What you sent'
      fields: ['name', 'email', 'subject', 'message']
    footer: 'Want to add anything? Just reply to this email. Your reply comes straight to me.'
  notification:
    subject: 'New contact: {subject}'
    preview: 'New message from {name} via the contact form.'
    badge: 'New contact'
    heading: 'New contact message'
    received: 'Received on {date}'
    footer: 'This is an automatic notification from the site contact form. Reply to this email to talk directly with {name}.'

notes: |
  Localization: copy.yaml (pt) and copy.en.yaml (en) are localized copy, not
  translation. Each line reads native in its language, so wording may diverge
  between the files on purpose.

  Projects: not in this file. Each project carries its own copy.

  Design-blind: no colors, fonts, icons, or layout in this file.
