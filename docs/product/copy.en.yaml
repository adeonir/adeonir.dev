metadata:
  source: 'docs/product/brief.md, docs/product/prd.md, conversation'
  created: '2026-06-06'
  updated: '2026-11-11'
  version: '1.1.0'
  status: 'ready'

project:
  name: 'adeonir.dev'
  language: 'en'
  industry: 'portfolio'
  title: 'Adeonir Kohl | Frontend Engineer'
  description: "I'm a design engineer working on the frontend, taking care of every detail of accessible, responsive, fast web interfaces."

intent:
  status: confirmed
  purpose: 'Present Adeonir, his work, and how he builds interfaces so clients, recruiters, and peers can evaluate him and get in touch.'
  reader_goal: 'Understand who Adeonir is, evaluate his work, and find a way to get in touch.'
  function: 'brand/editorial'
  constraints:
    - 'Lead with the work; contact is a secondary action.'
    - 'Use a personal, casual, clear voice without marketing language.'
    - 'Back the combination of design and code with specific facts, not adjectives. Proof through the work arrives with the timeline and projects sections.'
    - 'Forms, states, and navigation may use clear product/UX language while keeping the personal, informal tone.'

voice:
  status: confirmed
  line: 'Personal, casual, clear, and warm, with understated humor.'
  axes:
    formal_casual: casual
    reserved_bold: measured
    earnest_dry: earnest
    plain_playful: plain with occasional playfulness
  avoid:
    - 'Marketing language and generic adjectives.'
    - 'Designer and developer in equal parts.'

routes:
  home:
    title: 'Frontend Engineer'
  colophon:
    title: 'Colophon'
  not-found:
    title: 'Page not found'
  maintenance:
    title: 'Maintenance'

# The content tree covers the surfaces home, projects, project, colophon, plus a global not-found (404) error surface. Header and footer are persistent across every surface.

content:
  home:
    agentDocument:
      sections:
        hero: 'Hero'
        about: 'About me'
        projects: 'Projects'
        expertise: 'Capabilities'
        contact: 'Contact'
    header: &header
      logo:
        text: 'adeonir.dev'
      nav:
        - text: 'projects'
        - text: 'about'
        - text: 'contact'
      menu:
        label: 'Menu'
        open: 'Open menu'
        close: 'Close menu'
      theme:
        label: 'Light theme'
        to-light: 'Switch to light theme'
        to-dark: 'Switch to dark theme'
      language:
        label: 'Switch to Portuguese'

    hero:
      display: 'Adeonir Kohl'
      tagline: 'Design happens in code too.'
      description: "I'm a design engineer working on the frontend, taking care of every detail of the interface."
      availability: 'Available for work'
      actions:
        primary: 'See my projects'
        secondary: 'Get in touch'

    about:
      headline: 'Who I am'
      body: 'A bit of my story and what I like to do.'
      bio:
        - "Hi, I'm Adeonir, and I like building things for the internet. As a frontend and design engineer, I explore ideas through prototypes, create functional and accessible interfaces, build component libraries and design systems. I especially enjoy working at the intersection of design and code, always with an eye for detail."
        - 'After more than a decade as a graphic designer working on advertising materials, books, and magazines, I moved into frontend development. Day to day, I work mainly with React, TypeScript, Next.js, and Tailwind, and I use AI agents like Claude Code and Codex across the whole cycle, from specs and planning to implementation and review. I work in English at a professional level and have collaborated with teams in Europe and the US.'
        - 'Outside of work, I build a few personal projects where I design the interface and define the architecture, and get to practice backend and mobile development too.'
        - 'In my spare time, I like spending time with family, collecting Hot Wheels with my son, watching TV shows and movies, and hanging out with friends.'

    projects:
      headline: 'Ideas that went live'
      body: 'A few projects I helped build over the last years.'
      empty: "I don't have a featured project published here yet. If you want to know what I'm working on, send me a message."
      see-all: 'See all projects'

    expertise:
      headline: 'What I do'
      body: 'Day to day, I work with teams to build interfaces.'
      items:
        - title: 'Artificial intelligence'
          description: 'I use AI agents to plan solutions, create prototypes, and test code. I also integrate AI features into products, like the audio narration on this site.'
        - title: 'Design systems'
          description: "I keep the component library organized and documented, so the team can build new screens to the same standard without rewriting what's already there."
        - title: 'Accessible interfaces'
          description: 'I work on accessibility from the first component, so the interface also works with keyboard navigation or a screen reader.'
        - title: 'Performance'
          description: 'I care about how each screen performs, especially how long it takes to load and how it responds to interactions.'

    contact:
      headline: 'Send me a message'
      body: 'It can be about development, a project, or just to say hi.'
      social-label: 'Contact channels'
      social:
        - platform: 'email'
          label: 'contato@adeonir.dev'
          link: 'mailto:contato@adeonir.dev'
        - platform: 'github'
          label: 'github.com/adeonir'
          link: 'https://github.com/adeonir'
        - platform: 'linkedin'
          label: 'linkedin.com/in/adeonir'
          link: 'https://www.linkedin.com/in/adeonir'
        - platform: 'x'
          label: 'x.com/adeonir'
          link: 'https://x.com/adeonir'
      form:
        fields:
          - name: 'name'
            label: 'Name'
            placeholder: 'Your name'
          - name: 'email'
            label: 'Email'
            placeholder: 'you@example.com'
          - name: 'subject'
            label: 'Subject'
            placeholder: 'What do you want to talk about?'
          - name: 'message'
            label: 'Message'
            placeholder: 'Tell me more about what you have in mind.'
        submit: 'Send'
        states:
          success:
            title: 'Message sent'
            description: "Thanks! I'll be in touch soon."
          error:
            title: "We couldn't send your message"
            description: 'Try again or email me directly.'
        validation:
          required:
            name: 'I need to know your name.'
            email: "Don't forget your email."
            message: 'Write your message before sending.'
          email: 'Check your email, something looks off.'
          maxLength: 'Keep it to {max} characters or fewer.'

    narration:
      labels:
        hero: 'Listen to the intro'
        about: 'Listen to my story'
        expertise: 'Listen to what I do'
      error:
        title: "We couldn't play the narration"
        description: 'Try again in a moment.'

    footer: &footer
      brand:
        text: 'adeonir.dev'
        copyright: '© 2026 Adeonir Kohl'
        colophon:
          label: 'About this site'
          link: '/colophon'
      signoff: 'Built with care, coffee, and beer.'
      reveals:
        - word: 'coffee'
          phrase: 'Coffee to get things done'
        - word: 'beer'
          phrase: 'Beer to celebrate'

  projects:
    header: *header
    page-header:
      headline: 'All projects'
      subheadline: 'Sites I built for clients, for my family, and for myself.'
    links:
      more: 'See more'
      external: '{domain}'
      offline: 'Offline'
    states:
      empty: "No project published yet. I'm working on something, and it'll show up here soon."
    footer: *footer

  project:
    header: *header
    back: 'All projects'
    meta:
      launch: 'Launch'
      role: 'Role'
      stack: 'Stack'
      link: 'Link'
    body: {}
    nav:
      previous: 'Previous project'
      next: 'Next project'
    # not-found -> content.not-found.paths.projects
    footer: *footer

  colophon:
    header: *header
    back: 'Back'
    eyebrow: 'Colophon'
    headline: 'How this site was made'
    links:
      - label: 'Repository'
        link: 'https://github.com/adeonir/adeonir.dev'
      - label: 'Styleguide'
        link: '/styleguide'
    motivation:
      headline: 'Motivation'
      body:
        - "I'm a frontend engineer and I like working close to design. I made this site to show that in practice. Here I tell you what I used and why I made some of the choices."
    technologies:
      headline: 'Technologies'
      groups:
        - label: 'Stack'
          body:
            - 'I built the site with Astro and published it on Cloudflare.'
            - 'I used React for the interactive parts and Nanostores to share state between the islands. For the styles, I picked Tailwind CSS. For the primitives, I used Ark UI because they are headless. The animations were made with Motion. The form emails are templates in React Email sent through Resend.'
            - 'I wrote the code using Claude Code to define the specs, implement the tasks, and review the code.'
        - label: 'Design'
          body:
            - 'I started the design in Figma, then explored some interactions in Claude Design and prototyped straight in code. I also built a styleguide page to show the site tokens.'
            - 'For the colors, I used Catppuccin Mocha in the dark theme and Latte in the light one. For the text, I used Geist for headings and body and Fira Code for technical bits. The icons come from Tabler, and the character images were generated with ChatGPT Image.'
        - label: 'Content'
          body:
            - 'The site has Portuguese and English versions, split by language and organized in YAML files. The home narrations were generated with ElevenLabs using my own voice as the base.'
        - label: 'Quality'
          body:
            - 'I set up CI to run typecheck with TypeScript, linter with Biome, tests with Vitest and a Lighthouse audit. I follow how the site is used with PostHog.'
    decisions:
      headline: 'Decisions'
      items:
        - title: 'Content pages as static HTML'
          description: 'The content pages are generated during the build and only the contact form runs on the server. That way they reach the browser ready and faster.'
        - title: 'The form keeps no messages'
          description: "The form sends the messages to my email and no copy stays in a database or in the logs, because I don't want to keep data about whoever visits the site."
        - title: 'Analytics without cookies'
          description: "I set PostHog up to work without cookies and to respect Do Not Track. That way I don't need a privacy and consent banner."
        - title: 'Lighthouse targets in CI'
          description: 'I set a target of performance above 95 on mobile and 100 in accessibility, best practices and SEO, with WCAG AA as the accessibility reference. I care about the performance of every screen, and the audit checks it on each change.'
    cta:
      headline: 'Want to talk about any of these choices?'
      action: 'Get in touch'
    footer: *footer

  not-found:
    header: *header
    display: '404'
    headline: 'Page not found'
    body:
      - "This page doesn't exist or has moved."
    cta: 'Back to home'
    paths:
      projects:
        body:
          - "That project doesn't exist. Go back to all projects."
        cta: 'Back to projects'
    footer: *footer

# Hidden dev-console greeting — logged once per page load, not a routed surface.
console:
  greeting: "Hi, you're backstage now. If you find a bug, email me at contato@adeonir.dev"

# Transactional emails — not a routed surface. Sent on contact form submit.
# Tokens: {name} = sender's name (first name in body, full name in subjectFallback), {date} = received timestamp, {subject} = submitted subject (notification subject line).
# subjectFallback replaces the notification subject when the sender leaves the subject empty.
# Recap/table field values come from the submission, not copy.
emails:
  from: 'Adeonir'
  confirmation:
    subject: 'Got your message'
    preview: "I'll reply as soon as I can."
    heading: 'Your message was sent'
    body: "Hi, {name}! Thanks for reaching out. I got your message and I'll reply as soon as I can."
    recap:
      label: 'What you sent'
      fields: ['name', 'email', 'subject', 'message']
    footer: 'Want to add anything? Just reply to this email. Your reply comes straight to me.'
  notification:
    subject: 'New contact: {subject}'
    subjectFallback: 'Message from {name}'
    preview: 'New message from {name} via the contact form.'
    badge: 'New contact'
    heading: 'New contact message'
    received: 'Received on {date}'
    footer: 'This is an automatic notification from the site contact form. Reply to this email to talk directly with {name}.'

notes: |
  Localization: copy.yaml (pt) and copy.en.yaml (en) are localized copy, not
  translation. Each line reads native in its language, so wording may diverge
  between the files on purpose.

  Projects: not in this file. Each project carries its own copy.

  Colophon: the technology paragraphs name tools as plain prose. The links to
  each tool live in the collection file that renders the section.

  Design-blind: no colors, fonts, icons, or layout in this file.
