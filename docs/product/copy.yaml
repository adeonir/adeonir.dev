metadata:
  source: 'docs/product/brief.md, docs/product/prd.md, conversation'
  created: '2026-06-06'
  updated: '2026-09-28'
  version: '1.0.14'
  status: 'ready'

project:
  name: 'adeonir.dev'
  language: 'pt'
  industry: 'portfolio'
  title: 'Adeonir Kohl | Frontend Engineer'
  description: 'Sou design engineer e trabalho no frontend, cuidando de cada detalhe de interfaces web acessíveis, responsivas e rápidas.'

intent:
  status: confirmed
  purpose: 'Apresentar Adeonir, seu trabalho e sua forma de construir interfaces para que clientes, recrutadores e pares possam avaliá-lo e entrar em contato.'
  reader_goal: 'Entender quem Adeonir é, avaliar seu trabalho e encontrar uma forma de contato.'
  function: 'brand/editorial'
  constraints:
    - 'Priorizar o trabalho; contato é uma ação secundária.'
    - 'Usar voz pessoal, casual e clara, sem linguagem de marketing.'
    - 'Sustentar a combinação de design e código com fatos específicos, não com adjetivos. A prova pelo trabalho entra com as seções de trajetória e projetos.'
    - 'Formulário, estados e navegação podem usar linguagem clara de product/UX, mantendo o tom pessoal e informal.'

voice:
  status: confirmed
  line: 'Pessoal, casual, clara e calorosa, com humor discreto.'
  axes:
    formal_casual: casual
    reserved_bold: measured
    earnest_dry: earnest
    plain_playful: plain with occasional playfulness
  avoid:
    - 'Linguagem de marketing e adjetivos genéricos.'
    - 'Designer e desenvolvedor em partes iguais.'

routes:
  home:
    title: 'Frontend Engineer'
  not-found:
    title: 'Página não encontrada'
  maintenance:
    title: 'Manutenção'

# The content tree covers the surfaces home, projects, project, plus a global not-found (404) error surface. Header and footer are persistent across every surface.

content:
  home:
    agentDocument:
      sections:
        hero: 'Hero'
        about: 'Sobre mim'
        projects: 'Projetos'
        expertise: 'Especialidades'
        contact: 'Contato'
    header: &header
      logo:
        text: 'adeonir.dev'
      nav:
        - text: 'projetos'
        - text: 'sobre'
        - text: 'contato'
      menu:
        label: 'Menu'
        open: 'Abrir menu'
        close: 'Fechar menu'

    hero:
      eyebrow: 'Frontend Engineer'
      display: 'Adeonir Kohl'
      tagline: 'O design também acontece no código.'
      description: 'Sou design engineer e trabalho no frontend, cuidando de cada detalhe da interface.'
      availability: 'Disponível para trabalho'
      actions:
        primary: 'Ver meu trabalho'
        secondary: 'Entrar em contato'

    about:
      eyebrow: 'Sobre mim'
      headline: 'Do design ao código'
      body: 'De onde eu venho, no que trabalho hoje e o que faço além disso.'
      bio:
        - 'Olá, sou Adeonir e gosto de criar coisas para a internet. Sou frontend e design engineer, e estou em busca da próxima oportunidade. Exploro ideias em protótipos e crio interfaces funcionais e acessíveis, construindo as bibliotecas de componentes e design systems por trás delas. Gosto especialmente de trabalhar na interseção entre design e código, sempre de olho nos detalhes.'
        - 'Depois de mais de uma década como designer gráfico, criando materiais publicitários, livros e revistas, migrei para o desenvolvimento frontend. No dia a dia eu trabalho principalmente com React, TypeScript, Next.js e Tailwind, e uso agentes de IA como Claude Code e Codex em todo o ciclo, da especificação e planejamento à implementação e revisão. Trabalho em inglês com proficiência profissional e já colaborei com times da Europa e dos Estados Unidos.'
        - 'Fora do trabalho, desenvolvo alguns projetos pessoais, onde desenho a interface e defino a arquitetura, e também aplico meus conhecimentos em backend e desenvolvimento mobile.'
        - 'No meu tempo livre, gosto de ficar com a família, colecionar miniaturas de Hot Wheels com meu filho, assistir a séries e filmes e curtir com amigos.'

    projects:
      eyebrow: 'Projetos em destaque'
      headline: 'Ideias que saíram do papel'
      body: 'Alguns projetos que ajudei a construir nos últimos anos.'
      empty: 'Ainda não tenho nenhum projeto em destaque publicado aqui. Se quiser saber no que estou trabalhando, me manda uma mensagem.'
      see-all: 'Ver todos os projetos'

    expertise:
      eyebrow: 'Especialidades'
      headline: 'O que eu faço'
      body: 'O que eu faço no dia a dia, e o que o time ganha com isso.'
      items:
        - title: 'Inteligência artificial'
          description: 'Uso agentes de IA em processos estruturados para planejar, debugar, testar e revisar. Também faço integrações de recursos de IA nas interfaces.'
        - title: 'Design systems'
          description: 'Deixo a biblioteca de componentes organizada e documentada, para o time montar telas novas no mesmo padrão sem reescrever o que já existe.'
        - title: 'Interfaces acessíveis'
          description: 'Cuido da acessibilidade desde o primeiro componente, para que a interface funcione também com navegação pelo teclado ou leitor de tela.'
        - title: 'Performance'
          description: 'Me preocupo com performance em cada tela que construo, porque uma interface bem feita também precisa carregar rápido e responder sem atraso.'

    contact:
      eyebrow: 'Vamos conversar'
      headline: 'Me manda uma mensagem'
      body: 'Pode ser sobre desenvolvimento, um projeto ou só dar um oi.'
      social:
        - platform: 'email'
          label: 'contato@adeonir.dev'
          link: 'mailto:contato@adeonir.dev'
        - platform: 'github'
          label: 'github.com/adeonir'
          link: 'https://github.com/adeonir'
        - platform: 'linkedin'
          label: 'linkedin.com/in/adeonir'
          link: 'https://www.linkedin.com/in/adeonir'
        - platform: 'x'
          label: 'x.com/adeonir'
          link: 'https://x.com/adeonir'
      form:
        fields:
          - name: 'name'
            label: 'Nome'
            placeholder: 'Seu nome'
          - name: 'email'
            label: 'Email'
            placeholder: 'voce@exemplo.com'
          - name: 'subject'
            label: 'Assunto'
            placeholder: 'Sobre o que você quer falar?'
          - name: 'message'
            label: 'Mensagem'
            placeholder: 'Me conta mais sobre o que você tem em mente.'
        submit: 'Enviar'
        states:
          success:
            title: 'Mensagem enviada'
            description: 'Obrigado! Vou responder em breve.'
          error:
            title: 'Não foi possível enviar sua mensagem'
            description: 'Tenta de novo ou me escreve direto no email.'
        validation:
          required: 'Preencha este campo.'
          email: 'Digite um email válido.'
          maxLength: 'Use no máximo {max} caracteres.'

    narration:
      label: 'Ouvir'
      names:
        hero: 'Ouvir a apresentação'
        about: 'Ouvir a seção sobre mim'
        expertise: 'Ouvir a seção especialidades'
      error:
        title: 'Não foi possível tocar a narração'
        description: 'Tenta de novo em instantes.'

    footer: &footer
      brand:
        text: 'adeonir.dev'
        copyright: '© 2026 Adeonir Kohl'
      signoff: 'Feito com cuidado, café e cerveja.'
      reveals:
        - word: 'café'
          phrase: 'Café pra trabalhar'
        - word: 'cerveja'
          phrase: 'Cerveja pra comemorar'

  projects:
    header: *header
    page-header:
      headline: 'Todos os projetos'
      subheadline: 'Sites que fiz para clientes, para a minha família e para mim.'
    links:
      more: 'Ver mais'
      external: '{domain}'
      offline: 'Fora do ar'
    states:
      empty: 'Nenhum projeto publicado ainda. Estou trabalhando em algo e em breve ele aparece aqui.'
    footer: *footer

  project:
    header: *header
    back: 'Todos os projetos'
    meta:
      launch: 'Lançamento'
      role: 'Participação'
      stack: 'Stack'
      link: 'Link'
    body: {}
    nav:
      previous: 'Projeto anterior'
      next: 'Próximo projeto'
    # not-found -> content.not-found.paths.projects
    footer: *footer

  not-found:
    header: *header
    display: '404'
    headline: 'Página não encontrada'
    body:
      - 'Essa página não existe, ou mudou de lugar.'
    cta: 'Voltar ao início'
    paths:
      projects:
        body:
          - 'Esse projeto não existe. Volte para os projetos.'
        cta: 'Voltar aos projetos'
    footer: *footer

# Hidden dev-console greeting — logged once per page load, not a routed surface.
console:
  greeting: 'Olá, você está nos bastidores. Se encontrar um bug, me escreve: contato@adeonir.dev'

# Transactional emails — not a routed surface. Sent on contact form submit.
# Tokens: {name} = sender's name (first name in body), {date} = received timestamp, {subject} = submitted subject (notification subject line).
# Recap/table field values come from the submission, not copy.
emails:
  from: 'Adeonir'
  confirmation:
    subject: 'Recebi sua mensagem'
    preview: 'Respondo assim que puder.'
    heading: 'Sua mensagem foi enviada'
    body: 'Olá, {name}! Obrigado por entrar em contato. Recebi sua mensagem e respondo assim que puder.'
    recap:
      label: 'Resumo do envio'
      fields: ['nome', 'email', 'assunto', 'mensagem']
    footer: 'Quer acrescentar alguma coisa? É só responder a este email. Sua resposta chega direto para mim.'
  notification:
    subject: 'Novo contato: {subject}'
    preview: 'Nova mensagem de {name} pelo formulário de contato.'
    badge: 'Novo contato'
    heading: 'Nova mensagem de contato'
    received: 'Recebido em {date}'
    footer: 'Esta é uma notificação automática enviada pelo formulário de contato do site. Responda a este email para falar diretamente com {name}.'

notes: |
  Localization: copy.yaml (pt) and copy.en.yaml (en) are localized copy, not
  translation. Each line reads native in its language, so wording may diverge
  between the files on purpose.

  Projects: not in this file. Each project carries its own copy.

  Design-blind: no colors, fonts, icons, or layout in this file.
