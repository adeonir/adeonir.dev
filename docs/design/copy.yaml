metadata:
  source: 'docs/product/brief.md, docs/product/prd.md, docs/design/blueprint.md, conversation'
  created: '2026-06-06'
  version: '1.0.9'
  status: 'ready'

project:
  name: 'adeonir.dev'
  language: 'pt'
  industry: 'portfolio'
  title: 'Adeonir Kohl | Portfólio'
  description: 'Sou design engineer e levo decisões de design para o código, criando interfaces web acessíveis, responsivas e rápidas.'

intent:
  status: confirmed
  purpose: 'Apresentar Adeonir, seu trabalho e sua forma de construir interfaces para que clientes, recrutadores e pares possam avaliá-lo e entrar em contato.'
  reader_goal: 'Entender quem Adeonir é, avaliar seu trabalho e encontrar uma forma de contato.'
  function: 'brand/editorial'
  constraints:
    - 'Priorizar o trabalho; contato é uma ação secundária.'
    - 'Usar voz pessoal, casual e clara, sem linguagem de marketing.'
    - 'Sustentar a combinação de design e código com fatos específicos, não com adjetivos. A prova pelo trabalho entra com as seções de trajetória e projetos.'
    - 'Formulário, estados e navegação podem usar linguagem clara de product/UX, mantendo o tom pessoal e informal.'

voice:
  status: confirmed
  line: 'Pessoal, casual, clara e calorosa, com humor discreto.'
  axes:
    formal_casual: casual
    reserved_bold: measured
    earnest_dry: earnest
    plain_playful: plain with occasional playfulness
  avoid:
    - 'Linguagem de marketing e adjetivos genéricos.'
    - 'Designer e desenvolvedor em partes iguais.'

routes:
  home:
    title: 'Portfólio'
  not-found:
    title: 'Página não encontrada'
  maintenance:
    title: 'Manutenção'

# The content tree mirrors docs/design/blueprint.md: surfaces home, work, project,
# plus a global not-found (404) error surface.
# header and footer are persistent across every surface — defined once on
# home and aliased. Projects live in one top-level `projects` collection (always
# complete); the work index shows all, the landing shows featured: true.

content:
  home:
    agentDocument:
      sections:
        hero: 'Hero'
        about: 'Sobre mim'
        expertise: 'Especialidades'
        stack: 'Tecnologias'
        contact: 'Contato'
    header: &header
      logo:
        text: 'adeonir.dev'
      nav:
        - text: 'início'
        - text: 'sobre'
        - text: 'trabalho'
        - text: 'contato'
      menu:
        label: 'Menu'
        open: 'Abrir menu'
        close: 'Fechar menu'

    hero:
      eyebrow: 'Design Engineer'
      display: 'Adeonir Kohl'
      tagline: 'Eu construo interfaces web que funcionam.'
      description: 'Gosto de ver ideias tomarem forma e o design ganhar vida na tela.'
      actions:
        primary: 'Ver meu trabalho'
        secondary: 'Entrar em contato'
      scroll: 'role para ver mais'

    about:
      eyebrow: 'Sobre mim'
      headline: 'Do design ao código'
      bio:
        - 'Olá, sou Adeonir e gosto de criar coisas para a internet. Como design engineer, crio interfaces funcionais e acessíveis, sempre de olho nos detalhes. Gosto especialmente de trabalhar na interseção entre design e código.'
        - 'Atualmente sou Frontend Engineer na Jaya Tech, trabalhando com clientes nos Estados Unidos. Trabalho principalmente com React e TypeScript, desenvolvendo a biblioteca do design system e a plataforma web. Trabalho ao lado de designers e desenvolvedores para atender às necessidades dos usuários.'
        - 'Depois de anos como designer gráfico, criando materiais publicitários, livros e revistas, migrei para o desenvolvimento frontend. Desde então, trabalhei com produtos financeiros, plataformas de gestão empresarial e sistemas de recuperação de crédito.'
        - 'Trabalhei por um período na Joyjet, uma agência na França. Como UI Engineer, coordenei a equipe de UI Design e liderei dois desenvolvedores juniores. Mais tarde, como Frontend Developer, assumi um projeto legado em Vue e Express e reescrevi em React.'
        - 'Fora do trabalho, também desenvolvo projetos pessoais, principalmente landing pages. Essas experiências moldaram o jeito como penso ao construir interfaces.'
        - 'No meu tempo livre, gosto de ficar com a família, colecionar miniaturas de Hot Wheels com meu filho, assistir a séries e filmes e curtir com amigos.'

    expertise:
      eyebrow: 'Especialidades'
      headline: 'O que eu faço'
      body: 'O que eu faço no dia a dia, e o que o time ganha com isso.'
      items:
        - title: 'Interfaces acessíveis'
          description: 'Faço interfaces que funcionam bem em diferentes tamanhos, com semântica correta e acessibilidade desde o começo.'
        - title: 'Design systems'
          description: 'Deixo componentes organizados para o time montar novas telas com o mesmo padrão, sem reescrever o que já existe.'
        - title: 'Estado e dados'
          description: 'Faço integração de API e gerenciamento de estado, com cache e dados compartilhados entre as telas.'
        - title: 'Qualidade e testes'
          description: 'Uso testes automatizados para cobrir o comportamento do produto e acompanho erros e performance depois que ele está no ar.'
        - title: 'Métricas e experimentação'
          description: 'Adiciono eventos e experimentos para verificar se uma mudança fez diferença.'
        - title: 'Desenvolvimento assistido por IA'
          description: 'Desenvolvo usando agentes de IA que me ajudam a pensar, executar, testar, avaliar e ajustar o trabalho ao longo do processo.'

    stack:
      eyebrow: 'Tecnologias'
      headline: 'As ferramentas que eu uso'
      body: 'Ferramentas e tecnologias que uso em diferentes projetos.'
      tools:
        - title: 'frontend'
          items:
            - 'react'
            - 'next.js'
            - 'astro'
            - 'tanstack-start'
            - 'typescript'
            - 'tailwindcss'
            - 'zustand'
        - title: 'backend'
          items:
            - 'node.js'
            - 'hono'
            - 'fastify'
            - 'drizzle'
            - 'prisma'
            - 'sqlite'
            - 'postgresql'
        - title: 'tooling'
          items:
            - 'vite'
            - 'biome'
            - 'figma'
            - 'vscode'
            - 'claude-code'
            - 'cloudflare'
            - 'posthog'

    projects:
      eyebrow: 'Projetos em destaque'
      headline: 'Alguns projetos que desenhei e construí'
      # list -> top-level `projects` collection, filtered to featured: true
      see-all: 'Ver todos os projetos'

    contact:
      headline: 'Me manda uma mensagem'
      body: 'Podemos conversar sobre desenvolvimento, um projeto ou só dar um oi.'
      social:
        - platform: 'email'
          label: 'contato@adeonir.dev'
          link: 'mailto:contato@adeonir.dev'
        - platform: 'github'
          label: 'github.com/adeonir'
          link: 'https://github.com/adeonir'
        - platform: 'linkedin'
          label: 'linkedin.com/in/adeonir'
          link: 'https://www.linkedin.com/in/adeonir'
        - platform: 'x'
          label: 'x.com/adeonir'
          link: 'https://x.com/adeonir'
      form:
        fields:
          - name: 'name'
            label: 'Nome'
            placeholder: 'Seu nome'
          - name: 'email'
            label: 'Email'
            placeholder: 'voce@exemplo.com'
          - name: 'subject'
            label: 'Assunto'
            placeholder: 'Sobre o que você quer falar?'
          - name: 'message'
            label: 'Mensagem'
            placeholder: 'Me conta mais sobre o que você tem em mente.'
        submit: 'Enviar'
        states:
          success:
            title: 'Mensagem enviada'
            description: 'Obrigado! Vou responder em breve.'
          error:
            title: 'Não foi possível enviar sua mensagem'
            description: 'Tenta de novo ou me escreve direto no email.'
        validation:
          required: 'Preencha este campo.'
          email: 'Digite um email válido.'
          maxLength: 'Use no máximo {max} caracteres.'

    footer: &footer
      brand:
        text: 'adeonir.dev'
        copyright: '© 2026 Adeonir Kohl'
      signoff: 'Feito com cuidado, café e cerveja.'
      reveals:
        - word: 'café'
          phrase: 'Café pra trabalhar'
        - word: 'cerveja'
          phrase: 'Cerveja pra comemorar'

  work:
    header: *header
    page-header:
      eyebrow: 'Projetos'
      headline: 'Projetos que desenhei e construí'
      subheadline: 'Uma seleção de projetos que desenvolvi ou ajudei a construir.'
    # list -> top-level `projects` collection (all, in order)
    states:
      empty: 'Ainda não tem projetos por aqui. Volte em breve.'
    footer: *footer

  project:
    header: *header
    # Per-project detail. Page content is keyed by slug in the top-level
    # `projects` collection (overview / body / gallery / launch). The labels below
    # are the static chrome shared by every project detail surface.
    page-header:
      eyebrow: 'Projeto'
      # title and meta resolve from the matching projects entry:
      #   title -> name, meta -> "{role} · {launch}"
    overview:
      # text -> entry.overview, meta -> stack used + links (live: entry.link, repo: entry.repo)
      meta-label: 'Links'
    gallery: [] # images -> entry.gallery
    body: {} # long-form -> entry.body
    prev-next:
      prev:
        text: 'Projeto anterior'
      next:
        text: 'Próximo projeto'
    states:
      not-found: 'Esse projeto não existe. Volte para os projetos.'
    footer: *footer

  not-found:
    header: *header
    display: '404'
    headline: 'Página não encontrada'
    body:
      - 'Essa página não existe, ou mudou de lugar.'
    cta: 'Voltar ao início'
    footer: *footer

# Hidden dev-console greeting — logged once per page load, not a routed surface.
console:
  greeting: 'Bem-vindo aos bastidores. Me avisa se encontrar algum bug.'

# Transactional emails — not a routed surface. Sent on contact form submit.
# Tokens: {name} = sender's name (first name in body), {date} = received timestamp, {subject} = submitted subject (notification subject line).
# Recap/table field values come from the submission, not copy.
emails:
  from: 'Adeonir'
  confirmation:
    subject: 'Recebi sua mensagem'
    preview: 'Respondo assim que puder.'
    heading: 'Sua mensagem foi enviada'
    body: 'Olá, {name}! Obrigado por entrar em contato. Recebi sua mensagem e respondo assim que puder.'
    recap:
      label: 'Resumo do envio'
      fields: ['nome', 'email', 'assunto', 'mensagem']
    footer: 'Quer acrescentar alguma coisa? É só responder a este email. Sua resposta chega direto para mim.'
  notification:
    subject: 'Novo contato: {subject}'
    preview: 'Nova mensagem de {name} pelo formulário de contato.'
    badge: 'Novo contato'
    heading: 'Nova mensagem de contato'
    received: 'Recebido em {date}'
    footer: 'Esta é uma notificação automática enviada pelo formulário de contato do site. Responda a este email para falar diretamente com {name}.'

