metadata:
  source: 'docs/product/brief.md, docs/product/prd.md, docs/design/blueprint.md, conversation'
  created: '2026-06-06'
  version: '1.0.6'
  status: 'draft'

project:
  name: 'adeonir.dev'
  language: 'pt'
  industry: 'portfolio'
  title: 'Adeonir Kohl | Portfólio'
  description: 'Design engineer construindo interfaces web que funcionam.'

# The content tree mirrors docs/design/blueprint.md: surfaces home, work, project,
# plus a global not-found (404) error surface.
# header and footer are persistent across every surface — defined once on
# home and aliased. Projects live in one top-level `projects` collection (always
# complete); the work index shows all, the landing shows featured: true.

content:
  home:
    header: &header
      logo:
        text: 'adeonir.dev'
      nav:
        - text: 'sobre'
        - text: 'trabalho'
        - text: 'contato'
      menu:
        label: 'Menu'
        open: 'Abrir menu'
        close: 'Fechar menu'

    hero:
      eyebrow: 'Design Engineer'
      display: 'Adeonir Kohl'
      tagline: 'Eu construo interfaces web que funcionam.'
      description:
        - 'Gosto de ver as coisas tomando forma, o design ganhando vida na tela.'
      actions:
        primary: 'Ver meu trabalho'
        secondary: 'Entrar em contato'
      scroll: 'role para ver mais'

    about:
      eyebrow: 'Sobre mim'
      headline: 'Do design ao código.'
      bio:
        - 'Olá, sou Adeonir e gosto de desenvolver coisas para a internet. Eu sou design engineer e crio interfaces atraentes e funcionais, com atenção aos detalhes. Onde eu mais gosto de trabalhar é na interseção entre design e código.'
        - 'Atualmente sou Frontend Engineer na Jaya Tech e trabalho com clientes norte-americanos. Trabalho principalmente com React e TypeScript. Mantenho e evoluo a biblioteca do design system e a plataforma web, em parceria com designers e desenvolvedores, para atender às necessidades dos usuários.'
        - 'Depois de anos atuando como designer gráfico e criando materiais publicitários, livros e revistas, migrei para o desenvolvimento. Trabalhei com produtos financeiros, plataformas de gestão para empresas e sistemas de recuperação de crédito.'
        - 'Para uma agência na França, reescrevi um projeto legado em Vue e Express para React sem tirar o serviço do ar, liderei dois desenvolvedores e coordenei o time de UI Design. Fora do trabalho, também faço alguns projetos pessoais, principalmente landing pages e sites de e-commerce. Todas essas experiências mudaram o jeito como penso em construir uma interface.'
        - 'No meu tempo livre, gosto de ficar com a família, colecionar miniaturas de Hot Wheels com meu filho, assistir séries e filmes, e curtir com amigos.'

    stack:
      eyebrow: 'Tecnologias'
      headline: 'As ferramentas que eu uso.'
      tools:
        - title: 'frontend'
          items:
            - 'react'
            - 'next.js'
            - 'astro'
            - 'tanstack-start'
            - 'typescript'
            - 'tailwindcss'
            - 'zustand'
        - title: 'backend'
          items:
            - 'node.js'
            - 'hono'
            - 'fastify'
            - 'drizzle'
            - 'prisma'
            - 'sqlite'
            - 'postgresql'
        - title: 'tooling'
          items:
            - 'vite'
            - 'biome'
            - 'figma'
            - 'vscode'
            - 'claude-code'
            - 'cloudflare'
            - 'posthog'

    projects:
      eyebrow: 'Projetos em destaque'
      headline: 'Alguns projetos que desenhei e construí.'
      # list -> top-level `projects` collection, filtered to featured: true
      see-all: 'Ver todos os projetos'

    contact:
      headline: 'Me manda uma mensagem'
      body:
        - 'Pode ser sobre desenvolvimento, trabalhar junto, ou só trocar ideia.'
      social:
        - platform: 'email'
          label: 'contato@adeonir.dev'
          link: 'mailto:contato@adeonir.dev'
        - platform: 'github'
          label: 'github.com/adeonir'
          link: 'https://github.com/adeonir'
        - platform: 'linkedin'
          label: 'linkedin.com/in/adeonir'
          link: 'https://www.linkedin.com/in/adeonir'
        - platform: 'x'
          label: 'x.com/adeonir'
          link: 'https://x.com/adeonir'
      form:
        fields:
          - name: 'name'
            label: 'Nome'
            placeholder: 'Seu nome'
          - name: 'email'
            label: 'Email'
            placeholder: 'voce@exemplo.com'
          - name: 'subject'
            label: 'Assunto'
            placeholder: 'Sobre o que você quer falar?'
          - name: 'message'
            label: 'Mensagem'
            placeholder: 'Conta mais sobre o que você tem em mente.'
        submit: 'Enviar'
        states:
          success:
            title: 'Mensagem enviada'
            description: 'Obrigado! Logo eu entro em contato.'
          error:
            title: 'Deu algum problema'
            description: 'Tenta de novo ou me escreve direto no email.'
        validation:
          required: 'Esqueceu de preencher.'
          email: 'Confere esse email.'
          maxLength: 'Passou de {max} caracteres.'

    footer: &footer
      brand:
        text: 'adeonir.dev'
        copyright: '© 2026 Adeonir Kohl'
      tagline: 'Feito com cuidado, café e cerveja.'
      reveals:
        - word: 'café'
          phrase: 'Coffee to work'
        - word: 'cerveja'
          phrase: 'Beer to celebrate'

  work:
    header: *header
    page-header:
      eyebrow: 'Projetos'
      headline: 'Projetos que desenhei e construí.'
      subheadline: 'Uma seleção do que fiz ou ajudei a desenvolver.'
    # list -> top-level `projects` collection (all, in order)
    states:
      empty: 'Nenhum projeto por aqui ainda. Volte em breve.' # EC-1
    footer: *footer

  project:
    header: *header
    # Per-project detail. Page content is keyed by slug in the top-level
    # `projects` collection (overview / body / gallery / launch). The labels below
    # are the static chrome shared by every project detail surface.
    page-header:
      eyebrow: 'Projeto'
      # title and meta resolve from the matching projects entry:
      #   title -> name, meta -> "{role} · {launch}"
    overview:
      # text -> entry.overview, meta -> stack used + links (live: entry.link, repo: entry.repo)
      meta-label: 'Links'
    gallery: [] # images -> entry.gallery
    body: {} # long-form -> entry.body
    prev-next:
      prev:
        text: 'Projeto anterior'
      next:
        text: 'Próximo projeto'
    states:
      not-found: 'Esse projeto não existe. Voltar para os projetos.' # EC-3
    footer: *footer

  not-found:
    header: *header
    eyebrow: 'Erro 404'
    display: '404'
    headline: 'Página não encontrada.'
    body:
      - 'Esse endereço não existe, ou mudou de lugar.'
    cta: 'Voltar ao início'
    footer: *footer

# Hidden dev-console greeting — logged once per page load, not a routed surface.
console:
  greeting: 'Bem-vindo aos bastidores. Avisa se encontrar um bug.'

# Transactional emails — not a routed surface. Sent on contact form submit.
# Tokens: {name} = sender's name (first name in body), {date} = received timestamp, {subject} = submitted subject (notification subject line).
# Recap/table field values come from the submission, not copy.
emails:
  from: 'Adeonir'
  confirmation:
    subject: 'Recebi sua mensagem'
    preview: 'Respondo assim que possível.'
    heading: 'Sua mensagem foi enviada'
    body: 'Olá, {name}! Obrigado por entrar em contato. Recebi sua mensagem e respondo assim que possível.'
    recap:
      label: 'Resumo do envio'
      fields: ['nome', 'e-mail', 'assunto', 'mensagem']
    footer: 'Precisa acrescentar alguma informação? É só responder a este e-mail. Sua resposta chega direto para mim.'
  notification:
    subject: 'Novo contato: {subject}'
    preview: 'Nova mensagem de {name} pelo formulário de contato.'
    badge: 'Novo contato'
    heading: 'Nova mensagem de contato'
    received: 'Recebido em {date}'
    footer: 'Notificação automática enviada pelo formulário de contato do site. Responda a este e-mail para falar diretamente com {name}.'

