metadata:
  source: "docs/product/brief.md, docs/product/prd.md, docs/design/blueprint.md, conversation"
  created: "2026-06-06"
  version: "1.0.1"
  status: "draft"

project:
  name: "adeonir.dev"
  language: "pt"
  industry: "portfolio"
  title: "Adeonir Kohl | Portfólio"
  description: "Portfólio pessoal de Adeonir Kohl, um design engineer focado em estética e performance."
  meta_description: "Design engineer criando interfaces que são bonitas e rodam rápido"

# The content tree mirrors docs/design/blueprint.md: surfaces home, work, project.
# header and footer are persistent across all three surfaces — defined once on
# home and aliased. Projects live in one top-level `projects` collection (always
# complete); the work index shows all, the landing shows featured: true.

content:
  home:
    header: &header
      logo:
        text: "adeonir.dev"
      nav:
        - text: "sobre"
        - text: "projetos"
        - text: "contato"
      menu:
        label: "Menu"
        open: "Abrir menu"
        close: "Fechar menu"

    hero:
      eyebrow: "Design Engineer"
      display: "Olá, sou o Adeonir Kohl"
      tagline: "Construo interfaces que são bonitas e rodam rápido."
      description:
        - "Sou um design engineer — um desenvolvedor frontend com bagagem de designer — e cuido do produto inteiro, não só da interface, porque o melhor código entrega valor em vez de perseguir a perfeição."
      actions:
        primary: "Ver os projetos"
        secondary: "Entrar em contato"

    about:
      eyebrow: "Sobre mim"
      headline: "Do design ao código."
      bio:
        - "Depois de anos como designer gráfico, migrei para o código — isso não foi um desvio, foi uma evolução natural que me trouxe exatamente para onde design e engenharia se encontram. Sou desenvolvedor frontend há mais de 6 anos, trabalhando para empresas no Brasil, na Europa e, mais recentemente, nos EUA. Nos projetos que toco sozinho, coloco a mão na massa no design e no código, de ponta a ponta."
        - "Atualmente estou me aprofundando em product engineering e trazendo isso para os meus projetos — assumindo mais do produto do que apenas a interface."
        - "Eu trabalho com AI-assisted e agentic workflows para o trabalho pesado, sempre sob minha supervisão (HITL - Human in the loop). Isso me permite avançar rápido sem abrir mão de qualidade e bom senso."
      code-block:
        language: "ts"
        code: |
          const developer = {
            name: 'Adeonir Kohl',
            role: 'Design Engineer',
            based: 'Salvador do Sul, RS',
            focus: 'Design + Code + Product',
            stack: ['Figma', 'React', 'TypeScript', 'Tailwind CSS'],
            available: 'Aberto a colaborações',
            // Qualidade e entrega andam juntas.
          }

    stack:
      eyebrow: "Tech Stack"
      headline: "As ferramentas que uso para construir."
      tools:
        - title: "Frontend"
          items:
            - "React"
            - "Next.js"
            - "Astro"
            - "TanStack Start"
            - "TypeScript"
            - "Tailwind CSS"
        - title: "Backend"
          items:
            - "Node.js"
            - "Express"
            - "Fastify"
            - "Drizzle"
            - "Prisma"
            - "PostgreSQL"
            - "SQLite"
        - title: "Ferramentas"
          items:
            - "Figma"
            - "Pencil"
            - "Vite"
            - "Bun"
            - "Biome"
            - "Claude Code"
            - "Cursor"

    projects:
      eyebrow: "Projetos em destaque"
      headline: "Algumas coisas que desenhei e publiquei."
      # list -> top-level `projects` collection, filtered to featured: true
      see-all: "Ver todos os projetos"

    contact:
      eyebrow: "Vamos conversar"
      headline: "Tem um projeto em mente?"
      body:
        - "Adoro conhecer gente nova, trocar experiências e colaborar em projetos interessantes. Se você quer bater um papo sobre desenvolvimento ou tem uma ideia que precisa de uma mão para sair do papel — me manda uma mensagem."
      social:
        - platform: "email"
          label: "contato@adeonir.dev"
          link: "mailto:contato@adeonir.dev"
        - platform: "github"
          label: "github.com/adeonir"
          link: "https://github.com/adeonir"
        - platform: "linkedin"
          label: "linkedin.com/in/adeonir"
          link: "https://www.linkedin.com/in/adeonir"
        - platform: "x"
          label: "x.com/adeonir"
          link: "https://x.com/adeonir"
      form:
        fields:
          - name: "name"
            label: "Nome"
            placeholder: "Seu nome"
          - name: "email"
            label: "Email"
            placeholder: "voce@exemplo.com"
          - name: "message"
            label: "Mensagem"
            placeholder: "O que você está construindo?"
        submit: "Enviar mensagem"
        states:
          success: "Obrigado — em breve entro em contato."
          error: "Algo deu errado. Me escreva direto em contato@adeonir.dev."

    footer: &footer
      brand:
        text: "adeonir.dev"
        copyright: "© 2026 Adeonir Kohl"
      tagline: "Feito com cuidado, paixão e café."

  work:
    header: *header
    page-header:
      eyebrow: "Projetos"
      headline: "Coisas que desenhei e construí."
      subheadline: "Cada projeto, do início ao fim — design e código."
    # list -> top-level `projects` collection (all, in order)
    states:
      empty: "Nenhum projeto por aqui ainda — volte em breve." # EC-1
    footer: *footer

  project:
    header: *header
    # Per-project detail. Page content is keyed by slug in the top-level
    # `projects` collection (overview / body / gallery / launch). The labels below
    # are the static chrome shared by every project detail surface.
    page-header:
      eyebrow: "Projeto"
      # title and meta resolve from the matching projects entry:
      #   title -> name, meta -> "{role} · {launch}"
    overview:
      # text -> entry.overview, meta -> stack used + links (live: entry.link, repo: entry.repo)
      meta-label: "Links"
    gallery: [] # images -> entry.gallery
    body: {} # long-form -> entry.body
    prev-next:
      prev:
        text: "Projeto anterior"
      next:
        text: "Próximo projeto"
    states:
      not-found: "Esse projeto não existe. Voltar para os projetos." # EC-3
    footer: *footer

# Projects — single source of truth (always complete). The work index renders
