notes: |
  Voice: first person, present tense, confident, dry, proof outward (the work,
  not adjectives). Positioning shorthand "design + code" (aesthetics +
  performance); graphic-design → frontend arc, AI-assisted workflow under human
  supervision.

  Projects: one top-level `projects` collection (always complete). The work
  index shows all in order; the landing shows the featured: true ones.

  Placeholders to author (flagged, not invented — proof must stay outward):
  - Per-project case-study content: overview, body, gallery (images) are
    null/empty for all entries; author per project before the project detail
    surface has real content.
  - repo links are null — add if any project is open source.

  Design-blind: no colors, fonts, icons, or layout in this file. The about
  code-block carries a content snippet (language + code only), not styling.
