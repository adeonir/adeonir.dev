metadata:
  source: 'docs/product/brief.md, docs/product/prd.md, docs/design/blueprint.md, conversation'
  created: '2026-06-06'
  version: '1.0.6'
  status: 'ready'

project:
  name: 'adeonir.dev'
  language: 'en'
  industry: 'portfolio'
  title: 'Adeonir Kohl | Portfolio'
  description: 'Design engineer building web interfaces that work.'

routes:
  home:
    title: 'Portfolio'
  not-found:
    title: 'Page not found'
  maintenance:
    title: 'Maintenance'

# The content tree mirrors docs/design/blueprint.md: surfaces home, work, project,
# plus a global not-found (404) error surface.
# header and footer are persistent across every surface — defined once on
# home and aliased. Projects live in one top-level `projects` collection (always
# complete); the work index shows all, the landing shows featured: true.

content:
  home:
    header: &header
      logo:
        text: 'adeonir.dev'
      nav:
        - text: 'home'
        - text: 'about'
        - text: 'work'
        - text: 'contact'
      menu:
        label: 'Menu'
        open: 'Open menu'
        close: 'Close menu'

    hero:
      eyebrow: 'Design Engineer'
      display: 'Adeonir Kohl'
      tagline: 'I build web interfaces that work.'
      description: 'I like giving things shape, bringing design to life on screen.'
      actions:
        primary: 'See my work'
        secondary: 'Get in touch'
      scroll: 'scroll for more'

    about:
      eyebrow: 'About me'
      headline: 'From design to code.'
      bio:
        - "Hi, I'm Adeonir, and I like building things for the web. I'm a design engineer who creates interfaces that look good and work well, with an eye for detail. Where I most enjoy working is at the intersection of design and code."
        - "Currently, I'm a Frontend Engineer at Jaya Tech, working with clients from the US. I work mainly with React and TypeScript, maintaining and evolving the design system library and the web platform. I do this alongside designers and developers, to meet users' needs."
        - "After years as a graphic designer creating advertising materials, books, and magazines, I moved into development, frontend specifically. Since then, I've worked on financial products, business management platforms, and debt recovery systems. I worked for a while at an agency in France, where I rewrote a legacy Vue and Express project in React without taking the service offline, and coordinated the UI Design team leading two junior developers. Outside work, I take on personal projects, mostly landing pages. All these experiences changed how I think about building an interface."
        - 'In my spare time, I like spending time with family, collecting Hot Wheels with my son, watching series and movies, and hanging out with friends.'

    stack:
      eyebrow: 'Tech Stack'
      headline: 'The tools I build with.'
      body: 'Technologies and tools used across projects, chosen for each problem and context.'
      tools:
        - title: 'frontend'
          items:
            - 'react'
            - 'next.js'
            - 'astro'
            - 'tanstack-start'
            - 'typescript'
            - 'tailwindcss'
            - 'zustand'
        - title: 'backend'
          items:
            - 'node.js'
            - 'hono'
            - 'fastify'
            - 'drizzle'
            - 'prisma'
            - 'sqlite'
            - 'postgresql'
        - title: 'tooling'
          items:
            - 'vite'
            - 'biome'
            - 'figma'
            - 'vscode'
            - 'claude-code'
            - 'cloudflare'
            - 'posthog'

    projects:
      eyebrow: 'Featured work'
      headline: "A few things I've designed and shipped."
      # list -> top-level `projects` collection, filtered to featured: true
      see-all: 'See all work'

    contact:
      headline: 'Send me a message'
      body: 'You can write to talk about development, a project, or just say hi.'
      social:
        - platform: 'email'
          label: 'contato@adeonir.dev'
          link: 'mailto:contato@adeonir.dev'
        - platform: 'github'
          label: 'github.com/adeonir'
          link: 'https://github.com/adeonir'
        - platform: 'linkedin'
          label: 'linkedin.com/in/adeonir'
          link: 'https://www.linkedin.com/in/adeonir'
        - platform: 'x'
          label: 'x.com/adeonir'
          link: 'https://x.com/adeonir'
      form:
        fields:
          - name: 'name'
            label: 'Name'
            placeholder: 'Your name'
          - name: 'email'
            label: 'Email'
            placeholder: 'you@example.com'
          - name: 'subject'
            label: 'Subject'
            placeholder: 'What do you want to talk about?'
          - name: 'message'
            label: 'Message'
            placeholder: 'Tell me more about what you have in mind.'
        submit: 'Send'
        states:
          success:
            title: 'Message sent'
            description: "Thanks! I'll be in touch soon."
          error:
            title: 'Something went wrong'
            description: 'Try again or email me directly.'
        validation:
          required: 'You missed this one.'
          email: 'Double-check this email.'
          maxLength: "That's over {max} characters."

    footer: &footer
      brand:
        text: 'adeonir.dev'
        copyright: '© 2026 Adeonir Kohl'
      signoff: 'Built with care, coffee, and beer.'
      reveals:
        - word: 'coffee'
          phrase: 'Coffee to work'
        - word: 'beer'
          phrase: 'Beer to celebrate'

  work:
    header: *header
    page-header:
      eyebrow: 'Work'
      headline: "Things I've designed and built."
      subheadline: 'A selection of what I built or helped build.'
    # list -> top-level `projects` collection (all, in order)
    states:
      empty: 'No projects to show yet. Check back soon.' # EC-1
    footer: *footer

  project:
    header: *header
    # Per-project detail. Page content is keyed by slug in the top-level
    # `projects` collection (overview / body / gallery / launch). The labels below
    # are the static chrome shared by every project detail surface.
    page-header:
      eyebrow: 'Project'
      # title and meta resolve from the matching projects entry:
      #   title -> name, meta -> "{role} · {launch}"
    overview:
      # text -> entry.overview, meta -> stack used + links (live: entry.link, repo: entry.repo)
      meta-label: 'Links'
    gallery: [] # images -> entry.gallery
    body: {} # long-form -> entry.body
    prev-next:
      prev:
        text: 'Previous project'
      next:
        text: 'Next project'
    states:
      not-found: "That project doesn't exist. Back to all work." # EC-3
    footer: *footer

  not-found:
    header: *header
    display: '404'
    headline: 'Page not found.'
    body:
      - "This address doesn't exist, or it moved."
    cta: 'Back to home'
    footer: *footer

# Hidden dev-console greeting — logged once per page load, not a routed surface.
console:
  greeting: 'Welcome backstage. Let me know if you find a bug.'

# Transactional emails — not a routed surface. Sent on contact form submit.
# Tokens: {name} = sender's name (first name in body), {date} = received timestamp, {subject} = submitted subject (notification subject line).
# Recap/table field values come from the submission, not copy.
emails:
  from: 'Adeonir'
  confirmation:
    subject: 'Got your message'
    preview: "I'll reply as soon as I can."
    heading: 'Your message was sent'
    body: "Hi, {name}! Thanks for reaching out. I got your message and I'll reply as soon as I can."
    recap:
      label: 'What you sent'
      fields: ['name', 'email', 'subject', 'message']
    footer: 'Need to add anything? Just reply to this email and it comes straight to me.'
  notification:
    subject: 'New contact: {subject}'
    preview: 'New message from {name} via the contact form.'
    badge: 'New contact'
    heading: 'New contact message'
    received: 'Received on {date}'
    footer: 'Automatic notification from the site contact form. Reply to this email to talk directly with {name}.'

