notes: |
  Localization: copy.yaml (pt) and copy.en.yaml (en) are localized copy, not
  translation. Each line reads native in its language, so wording may diverge
  between the files on purpose.

  Projects: one top-level `projects` collection (always complete). The work
  index shows all in order; the landing shows the featured: true ones.

  Still to author (flagged, not invented):
  - Per-project case-study content: overview, body, gallery (images) are
    null/empty for all entries.
  - repo links are null — add if any project is open source.
  - The about timeline (companies, roles, periods) has no key yet.

  Design-blind: no colors, fonts, icons, or layout in this file.
