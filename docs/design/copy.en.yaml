metadata:
  source: 'docs/product/brief.md, docs/product/prd.md, conversation'
  created: '2026-06-06'
  version: '1.0.9'
  status: 'ready'

project:
  name: 'adeonir.dev'
  language: 'en'
  industry: 'portfolio'
  title: 'Adeonir Kohl | Portfolio'
  description: "I'm a frontend engineer working in design engineering, bringing design decisions into code to build accessible, responsive, fast web interfaces."

intent:
  status: confirmed
  purpose: 'Present Adeonir, his work, and how he builds interfaces so clients, recruiters, and peers can evaluate him and get in touch.'
  reader_goal: 'Understand who Adeonir is, evaluate his work, and find a way to get in touch.'
  function: 'brand/editorial'
  constraints:
    - 'Lead with the work; contact is a secondary action.'
    - 'Use a personal, casual, clear voice without marketing language.'
    - 'Back the combination of design and code with specific facts, not adjectives. Proof through the work arrives with the timeline and projects sections.'
    - 'Forms, states, and navigation may use clear product/UX language while keeping the personal, informal tone.'

voice:
  status: confirmed
  line: 'Personal, casual, clear, and warm, with understated humor.'
  axes:
    formal_casual: casual
    reserved_bold: measured
    earnest_dry: earnest
    plain_playful: plain with occasional playfulness
  avoid:
    - 'Marketing language and generic adjectives.'
    - 'Designer and developer in equal parts.'

routes:
  home:
    title: 'Portfolio'
  not-found:
    title: 'Page not found'
  maintenance:
    title: 'Maintenance'

# The content tree covers the surfaces home, work, project, plus a global not-found (404) error surface. Header and footer are persistent across every surface — defined once on home and aliased. Projects live in one top-level `projects` collection (always complete); the work index shows all, the landing shows featured: true.

content:
  home:
    agentDocument:
      sections:
        hero: 'Hero'
        about: 'About me'
        projects: 'Projects'
        expertise: 'Capabilities'
        stack: 'Tech Stack'
        contact: 'Contact'
    header: &header
      logo:
        text: 'adeonir.dev'
      nav:
        - text: 'projects'
        - text: 'about'
        - text: 'contact'
      menu:
        label: 'Menu'
        open: 'Open menu'
        close: 'Close menu'

    hero:
      eyebrow: 'Frontend Engineer'
      display: 'Adeonir Kohl'
      tagline: 'I build web interfaces that work.'
      description: 'I like seeing ideas take shape and design come to life on screen.'
      actions:
        primary: 'See my projects'
        secondary: 'Get in touch'
      scroll: 'scroll for more'

    about:
      eyebrow: 'About me'
      headline: 'From design to code'
      body: 'Where I come from, what I work on today, and what I get up to beyond that.'
      bio:
        - "Hi, I'm Adeonir, and I like building things for the internet. I work as a frontend engineer, and the part I'm most drawn to is design engineering. I test ideas in prototypes and build functional, accessible interfaces, always keeping an eye on the details. I particularly enjoy working at the intersection of design and code."
        - "I'm currently a Frontend Engineer at Jaya Tech, and I'm part of the product team at The Zebra, a US car insurance company, where I work on the design system library and the web platform. I mainly use React and TypeScript, and I work with designers, developers, and product managers."
        - "After years as a graphic designer creating advertising materials, books, and magazines, I moved into frontend development. Since then, I've worked on financial products, business management platforms, and creditor investigation and asset recovery systems."
        - "I worked for a while at Joyjet, an agency in France. I started as a UI Engineer, then as Lead UI Engineer, leading UI implementation decisions and mentoring a junior developer. As a Senior Frontend Developer, I took over a legacy Vue and Express project and defined the frontend architecture for its progressive migration from Vue to React."
        - 'Outside of work, I build a few personal projects where I decide the visual design and the architecture, and also apply my knowledge of backend and mobile development. These experiences shaped how I think about building interfaces.'
        - 'In my spare time, I like spending time with family, collecting Hot Wheels with my son, watching TV shows and movies, and hanging out with friends.'

    projects:
      eyebrow: 'Featured projects'
      headline: 'Ideas that went live'
      body: 'A few projects I helped build over the last years.'
      empty: "I don't have a featured project published here yet. If you want to know what I'm working on, send me a message."
      see-all: 'See all projects'

    expertise:
      eyebrow: 'Capabilities'
      headline: 'What I do'
      body: 'What I do day to day, and what the team gets from it.'
      items:
        - title: 'Accessible interfaces'
          description: 'I make interfaces that work well across screen sizes, with proper semantics and accessibility from the start.'
        - title: 'Design systems'
          description: 'I keep the library organized and documented so the team can build new screens that feel consistent without rewriting what’s already there.'
        - title: 'State and data'
          description: 'I handle API integration and state management, with caching and shared data across screens.'
        - title: 'Quality and testing'
          description: "I use automated tests to cover how the product behaves and keep an eye on errors and performance once it's live."
        - title: 'AI-assisted development'
          description: 'I use AI agents in structured processes: research, intent definition, specification, planning, implementation, and testing. I review and adjust the work along the way.'

    stack:
      eyebrow: 'Tech Stack'
      headline: 'The tools I build with'
      body: 'Some of the tools and technologies I use across projects.'
      tools:
        - title: 'frontend'
          items:
            - 'react'
            - 'next.js'
            - 'tanstack-start'
            - 'typescript'
            - 'tailwindcss'
            - 'zustand'
            - 'react-native'
        - title: 'backend'
          items:
            - 'node.js'
            - 'fastify'
            - 'hono'
            - 'drizzle'
            - 'prisma'
            - 'sqlite'
            - 'postgresql'
        - title: 'tooling'
          items:
            - 'figma'
            - 'vscode'
            - 'vite'
            - 'vitest'
            - 'claude'
            - 'codex'
            - 'cloudflare'

    contact:
      eyebrow: "Let's talk"
      headline: 'Send me a message'
      body: 'It can be about development, a project, or just to say hi.'
      social:
        - platform: 'email'
          label: 'contato@adeonir.dev'
          link: 'mailto:contato@adeonir.dev'
        - platform: 'github'
          label: 'github.com/adeonir'
          link: 'https://github.com/adeonir'
        - platform: 'linkedin'
          label: 'linkedin.com/in/adeonir'
          link: 'https://www.linkedin.com/in/adeonir'
        - platform: 'x'
          label: 'x.com/adeonir'
          link: 'https://x.com/adeonir'
      form:
        fields:
          - name: 'name'
            label: 'Name'
            placeholder: 'Your name'
          - name: 'email'
            label: 'Email'
            placeholder: 'you@example.com'
          - name: 'subject'
            label: 'Subject'
            placeholder: 'What do you want to talk about?'
          - name: 'message'
            label: 'Message'
            placeholder: 'Tell me more about what you have in mind.'
        submit: 'Send'
        states:
          success:
            title: 'Message sent'
            description: "Thanks! I'll be in touch soon."
          error:
            title: "We couldn't send your message"
            description: 'Try again or email me directly.'
        validation:
          required: 'This field is required.'
          email: 'Enter a valid email address.'
          maxLength: 'Use {max} characters or fewer.'

    footer: &footer
      brand:
        text: 'adeonir.dev'
        copyright: '© 2026 Adeonir Kohl'
      signoff: 'Built with care, coffee, and beer.'
      reveals:
        - word: 'coffee'
          phrase: 'Coffee to get things done'
        - word: 'beer'
          phrase: 'Beer to celebrate'

  projects:
    header: *header
    page-header:
      eyebrow: 'Work'
      headline: "Projects I've designed and built"
      subheadline: 'A selection of projects I developed or helped build.'
    # list -> top-level `projects` collection (all, in order)
    states:
      empty: "There aren't any projects here yet. Check back soon."
    footer: *footer

  project:
    header: *header
    # Per-project detail. Page content is keyed by slug in the top-level `projects` collection (overview / body / gallery / launch). The labels below are the static chrome shared by every project detail surface.
    page-header:
      eyebrow: 'Project'
      # title and meta resolve from the matching projects entry: title -> name, meta -> "{role} · {launch}"
    overview:
      # text -> entry.overview, meta -> stack used + links (live: entry.link, repo: entry.repo)
      meta-label: 'Links'
    gallery: [] # images -> entry.gallery
    body: {} # long-form -> entry.body
    prev-next:
      prev:
        text: 'Previous project'
      next:
        text: 'Next project'
    states:
      not-found: "That project doesn't exist. Go back to all projects."
    footer: *footer

  not-found:
    header: *header
    display: '404'
    headline: 'Page not found'
    body:
      - "This page doesn't exist or has moved."
    cta: 'Back to home'
    footer: *footer

# Hidden dev-console greeting — logged once per page load, not a routed surface.
console:
  greeting: 'Welcome behind the scenes. Let me know if you find a bug.'

# Transactional emails — not a routed surface. Sent on contact form submit.
# Tokens: {name} = sender's name (first name in body), {date} = received timestamp, {subject} = submitted subject (notification subject line).
# Recap/table field values come from the submission, not copy.
emails:
  from: 'Adeonir'
  confirmation:
    subject: 'Got your message'
    preview: "I'll reply as soon as I can."
    heading: 'Your message was sent'
    body: "Hi, {name}! Thanks for reaching out. I got your message and I'll reply as soon as I can."
    recap:
      label: 'What you sent'
      fields: ['name', 'email', 'subject', 'message']
    footer: 'Want to add anything? Just reply to this email. Your reply comes straight to me.'
  notification:
    subject: 'New contact: {subject}'
    preview: 'New message from {name} via the contact form.'
    badge: 'New contact'
    heading: 'New contact message'
    received: 'Received on {date}'
    footer: 'This is an automatic notification from the site contact form. Reply to this email to talk directly with {name}.'

