metadata:
  source: 'docs/product/brief.md, docs/product/prd.md, docs/design/blueprint.md, conversation'
  created: '2026-06-06'
  version: '1.0.2'
  status: 'draft'

project:
  name: 'adeonir.dev'
  language: 'en'
  industry: 'portfolio'
  title: 'Adeonir Kohl | Portfolio'
  description: 'Personal portfolio for Adeonir Kohl, a design engineer focused on aesthetics and performance.'
  meta_description: 'Design engineer building interfaces that look beautiful and run fast'

# The content tree mirrors docs/design/blueprint.md: surfaces home, work, project,
# plus a global not-found (404) error surface.
# header and footer are persistent across every surface — defined once on
# home and aliased. Projects live in one top-level `projects` collection (always
# complete); the work index shows all, the landing shows featured: true.

content:
  home:
    header: &header
      logo:
        text: 'adeonir.dev'
      nav:
        - text: 'about'
        - text: 'projects'
        - text: 'contact'
      menu:
        label: 'Menu'
        open: 'Open menu'
        close: 'Close menu'

    hero:
      eyebrow: 'Design Engineer'
      display: "Hi, I'm Adeonir Kohl"
      tagline: 'I build interfaces that look beautiful and run fast.'
      description:
        - "I'm a design engineer: a frontend developer with a designer's background."
        - "That makes me think about the whole product, not just the UI, always seeking solutions that deliver value without chasing perfection."
      actions:
        primary: 'See the work'
        secondary: 'Get in touch'

    about:
      eyebrow: 'About me'
      headline: 'From design to code.'
      bio:
        - "After years as a graphic designer, I moved into development in a natural evolution that put me exactly where design and code meet. I've been a frontend developer for 6+ years, working for companies in Brazil, Europe, and recently the US. On the projects I run myself, I handle the code end to end, and the design too when needed."
        - "These days I'm digging into product engineering and bringing that knowledge into my projects, going beyond the interface."
        - 'I use AI tools and agentic workflows for the heavy lifting, always under my supervision (HITL - Human in the loop). It lets me move fast without trading away craft or judgment.'
      code-block:
        language: 'ts'
        code: |
          const developer = {
            name: 'Adeonir Kohl',
            role: 'Design Engineer',
            based: 'Salvador do Sul, RS',
            focus: 'Code + Design + Product',
            stack: ['Figma', 'React', 'TypeScript', 'Tailwind CSS'],
            available: 'Open to collaborations',
            // Quality and delivery walk together.
          }

    stack:
      eyebrow: 'Tech Stack'
      headline: 'The tools I build with.'
      tools:
        - title: 'frontend'
          items:
            - 'react'
            - 'next.js'
            - 'astro'
            - 'tanstack-start'
            - 'typescript'
            - 'tailwindcss'
            - 'zustand'
        - title: 'backend'
          items:
            - 'node.js'
            - 'hono'
            - 'fastify'
            - 'drizzle'
            - 'prisma'
            - 'sqlite'
            - 'postgresql'
        - title: 'tooling'
          items:
            - 'vite'
            - 'biome'
            - 'figma'
            - 'vscode'
            - 'claude-code'
            - 'cloudflare'
            - 'posthog'

    projects:
      eyebrow: 'Featured work'
      headline: "A few things I've designed and shipped."
      # list -> top-level `projects` collection, filtered to featured: true
      see-all: 'See all work'

    contact:
      eyebrow: "Let's talk"
      headline: 'Have a project in mind?'
      body:
        - 'I love meeting new people, trading experiences, and collaborating on interesting projects. Whether you want to chat about development or have an idea that needs a hand getting off the ground, drop me a message.'
      social:
        - platform: 'email'
          label: 'contato@adeonir.dev'
          link: 'mailto:contato@adeonir.dev'
        - platform: 'github'
          label: 'github.com/adeonir'
          link: 'https://github.com/adeonir'
        - platform: 'linkedin'
          label: 'linkedin.com/in/adeonir'
          link: 'https://www.linkedin.com/in/adeonir'
        - platform: 'x'
          label: 'x.com/adeonir'
          link: 'https://x.com/adeonir'
      form:
        fields:
          - name: 'name'
            label: 'Name'
            placeholder: 'Your name'
          - name: 'email'
            label: 'Email'
            placeholder: 'you@example.com'
          - name: 'subject'
            label: 'Subject'
            placeholder: 'What do you want to talk about?'
          - name: 'message'
            label: 'Message'
            placeholder: 'Tell me more about your idea.'
        submit: 'Send message'
        states:
          success: "Thanks! I'll be in touch soon."
          error: 'Something went wrong. Email me directly at contato@adeonir.dev.'

    footer: &footer
      brand:
        text: 'adeonir.dev'
        copyright: '© 2026 Adeonir Kohl'
      tagline: 'Built with care, passion, and coffee.'

  work:
    header: *header
    page-header:
      eyebrow: 'Work'
      headline: "Things I've designed and built."
      subheadline: 'A selection of what I built or helped build.'
    # list -> top-level `projects` collection (all, in order)
    states:
      empty: 'No projects to show yet, check back soon.' # EC-1
    footer: *footer

  project:
    header: *header
    # Per-project detail. Page content is keyed by slug in the top-level
    # `projects` collection (overview / body / gallery / launch). The labels below
    # are the static chrome shared by every project detail surface.
    page-header:
      eyebrow: 'Project'
      # title and meta resolve from the matching projects entry:
      #   title -> name, meta -> "{role} · {launch}"
    overview:
      # text -> entry.overview, meta -> stack used + links (live: entry.link, repo: entry.repo)
      meta-label: 'Links'
    gallery: [] # images -> entry.gallery
    body: {} # long-form -> entry.body
    prev-next:
      prev:
        text: 'Previous project'
      next:
        text: 'Next project'
    states:
      not-found: "That project doesn't exist. Back to all work." # EC-3
    footer: *footer

  not-found:
    header: *header
    eyebrow: 'Error 404'
    display: '404'
    headline: 'Page not found.'
    body:
      - "The page you're looking for doesn't exist or has moved. Head back to the homepage and pick up from there."
    cta: 'Back to home'
    footer: *footer

# Transactional emails — not a routed surface. Sent on contact form submit.
# Tokens: {name} = sender's name (first name in body/button), {date} = received timestamp.
# Recap/table field values come from the submission, not copy.
emails:
  confirmation:
    preview: "Got your message, I'll reply as soon as I can."
    heading: 'Your message was sent'
    body: "Hi, {name}! Thanks for reaching out. I got your message and I'll reply within 48 hours."
    recap:
      label: 'What you sent'
      fields: ['name', 'email', 'subject', 'message']
    footer: 'Need to add anything? Just reply to this email and it comes straight to me.'
  notification:
    preview: 'New message from {name} via the contact form.'
    badge: 'New contact'
    heading: 'New contact message'
    received: 'Received on {date}'
    button: 'Reply to {name}'
    footer: 'Automatic notification from the site contact form. Reply to this email to talk directly with {name}.'

