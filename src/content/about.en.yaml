about:
  eyebrow: 'About me'
  headline:
    - text: 'From '
    - text: 'design'
      highlight: true
    - text: ' to '
    - text: 'code'
      highlight: true
    - text: '.'
  bio:
    - "Hi, I'm Adeonir, and I like building things for the web. I'm a design engineer who creates interfaces that look good and work well, with an eye for detail. Where I most enjoy working is at the intersection of design and code."
    - "Currently, I'm a Frontend Engineer at Jaya Tech, working with clients from the US. I work mainly with React and TypeScript, maintaining and evolving the design system library and the web platform. I do this alongside designers and developers, to meet users' needs."
    - "After years as a graphic designer creating advertising materials, books, and magazines, I moved into development, frontend specifically. Since then, I've worked on financial products, business management platforms, and debt recovery systems. I worked for a while at an agency in France, where I rewrote a legacy Vue and Express project in React without taking the service offline, and coordinated the UI Design team leading two junior developers. Outside work, I take on personal projects, mostly landing pages. All these experiences changed how I think about building an interface."
    - 'In my spare time, I like spending time with family, collecting Hot Wheels with my son, watching series and movies, and hanging out with friends.'
