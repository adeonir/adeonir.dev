about:
  eyebrow: 'About me'
  headline:
    - text: 'From '
    - text: 'design'
      highlight: true
    - text: ' to '
    - text: 'code'
      highlight: true
  bio:
    - - text: "Hi, I'm Adeonir, and I like building things for the internet. As a design engineer, I create functional, accessible interfaces, always keeping an eye on the details. I particularly enjoy working at the intersection of design and code."
    - - text: "I'm currently a Frontend Engineer at "
      - text: 'Jaya Tech'
        href: 'https://jaya.tech/'
      - text: ", working with clients in the US. I work mainly with React and TypeScript, developing the design system library and web platform. I work alongside designers and developers to meet users' needs."
    - - text: "After years as a graphic designer creating advertising materials, books, and magazines, I moved into frontend development. Since then, I've worked on financial products, business management platforms, and debt recovery systems."
    - - text: 'I worked for a while at '
      - text: 'Joyjet'
        href: 'https://joyjet.com/'
      - text: ', an agency in France. As a UI Engineer, I coordinated the UI Design team and led two junior developers. Later, as a Frontend Developer, I took over a legacy Vue and Express project and rewrote it in React.'
    - - text: 'Outside of work, I also build personal projects, mostly landing pages. These experiences shaped how I think about building interfaces.'
    - - text: 'In my spare time, I like spending time with family, collecting Hot Wheels with my son, watching TV shows and movies, and hanging out with friends.'
