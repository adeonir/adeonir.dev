headline: 'Technologies'
groups:
  - label: 'Stack'
    paragraphs:
      - - text: 'I built the site with '
        - text: 'Astro'
          href: 'https://astro.build'
        - text: ' and published it on '
        - text: 'Cloudflare'
          href: 'https://www.cloudflare.com'
        - text: '.'
      - - text: 'I used React for the interactive parts and '
        - text: 'Nanostores'
          href: 'https://github.com/nanostores/nanostores'
        - text: ' to share state between the islands. For the styles, I picked '
        - text: 'Tailwind CSS'
          href: 'https://tailwindcss.com'
        - text: '. For the primitives, I used '
        - text: 'Ark UI'
          href: 'https://ark-ui.com'
        - text: ' because they are headless. The animations were made with '
        - text: 'Motion'
          href: 'https://motion.dev'
        - text: '. The form emails are templates in '
        - text: 'React Email'
          href: 'https://react.email'
        - text: ' sent through '
        - text: 'Resend'
          href: 'https://resend.com'
        - text: '.'
      - - text: 'I wrote the code using '
        - text: 'Claude Code'
          href: 'https://claude.com/product/claude-code'
        - text: ' to define the specs, implement the tasks, and review the code.'
  - label: 'Design'
    paragraphs:
      - - text: 'I started the design in '
        - text: 'Figma'
          href: 'https://www.figma.com'
        - text: ', then explored some interactions in Claude Design and prototyped straight in code. I also built a '
        - text: 'styleguide'
          href: '/styleguide'
        - text: ' page to show the site tokens.'
      - - text: 'For the colors, I used '
        - text: 'Catppuccin'
          href: 'https://catppuccin.com'
        - text: ' Mocha in the dark theme and Latte in the light one. For the text, I used '
        - text: 'Geist'
          href: 'https://vercel.com/font'
        - text: ' for headings and body and '
        - text: 'Fira Code'
          href: 'https://github.com/tonsky/FiraCode'
        - text: ' for technical bits. The icons come from '
        - text: 'Tabler'
          href: 'https://tabler.io/icons'
        - text: ', and the character images were generated with ChatGPT Image.'
  - label: 'Content'
    paragraphs:
      - - text: 'The site has Portuguese and English versions, split by language and organized in YAML files. The home narrations were generated with '
        - text: 'ElevenLabs'
          href: 'https://elevenlabs.io'
        - text: ' using my own voice as the base.'
  - label: 'Quality'
    paragraphs:
      - - text: 'I set up CI to run typecheck with '
        - text: 'TypeScript'
          href: 'https://www.typescriptlang.org'
        - text: ', linter with '
        - text: 'Biome'
          href: 'https://biomejs.dev'
        - text: ', tests with '
        - text: 'Vitest'
          href: 'https://vitest.dev'
        - text: ' and a '
        - text: 'Lighthouse'
          href: 'https://developer.chrome.com/docs/lighthouse'
        - text: ' audit. I follow how the site is used with '
        - text: 'PostHog'
          href: 'https://posthog.com'
        - text: '.'
