headline: 'Tecnologias'
groups:
  - label: 'Stack'
    paragraphs:
      - - text: 'Fiz o site com '
        - text: 'Astro'
          href: 'https://astro.build'
        - text: ' e publiquei na '
        - text: 'Cloudflare'
          href: 'https://www.cloudflare.com'
        - text: '.'
      - - text: 'Usei React nas partes interativas e '
        - text: 'Nanostores'
          href: 'https://github.com/nanostores/nanostores'
        - text: ' para compartilhar o estado entre as islands. Para os estilos, escolhi '
        - text: 'Tailwind CSS'
          href: 'https://tailwindcss.com'
        - text: '. Para os componentes primitivos, usei '
        - text: 'Ark UI'
          href: 'https://ark-ui.com'
        - text: ' porque eles são headless. As animações foram feitas com '
        - text: 'Motion'
          href: 'https://motion.dev'
        - text: '. Os emails do formulário são templates em '
        - text: 'React Email'
          href: 'https://react.email'
        - text: ' enviados pelo '
        - text: 'Resend'
          href: 'https://resend.com'
        - text: '.'
      - - text: 'Escrevi o código usando o '
        - text: 'Claude Code'
          href: 'https://claude.com/product/claude-code'
        - text: ' na definição da especificação, na implementação das tarefas e na revisão de código.'
  - label: 'Design'
    paragraphs:
      - - text: 'Comecei o design no '
        - text: 'Figma'
          href: 'https://www.figma.com'
        - text: ', depois explorei algumas interações no Claude Design e fiz protótipos direto no código. Também criei uma página de '
        - text: 'styleguide'
          href: '/styleguide'
        - text: ' para mostrar os tokens do site.'
      - - text: 'Para as cores, usei '
        - text: 'Catppuccin'
          href: 'https://catppuccin.com'
        - text: ' Mocha no tema escuro e Latte no tema claro. Nos textos eu usei '
        - text: 'Geist'
          href: 'https://vercel.com/font'
        - text: ' para os títulos e o corpo e '
        - text: 'Fira Code'
          href: 'https://github.com/tonsky/FiraCode'
        - text: ' nos trechos técnicos. Os ícones são da biblioteca '
        - text: 'Tabler'
          href: 'https://tabler.io/icons'
        - text: ', e as imagens dos personagens foram geradas com o ChatGPT Image.'
  - label: 'Conteúdo'
    paragraphs:
      - - text: 'O site tem versões em português e inglês, separadas por idioma e organizadas em arquivos YAML. As narrações da home foram geradas com '
        - text: 'ElevenLabs'
          href: 'https://elevenlabs.io'
        - text: ' usando minha voz como base.'
  - label: 'Qualidade'
    paragraphs:
      - - text: 'Configurei o CI para rodar typecheck com '
        - text: 'TypeScript'
          href: 'https://www.typescriptlang.org'
        - text: ', linter com '
        - text: 'Biome'
          href: 'https://biomejs.dev'
        - text: ', testes com '
        - text: 'Vitest'
          href: 'https://vitest.dev'
        - text: ' e uma auditoria do '
        - text: 'Lighthouse'
          href: 'https://developer.chrome.com/docs/lighthouse'
        - text: '. Acompanho o uso do site com o '
        - text: 'PostHog'
          href: 'https://posthog.com'
        - text: '.'
