contact:
  eyebrow: 'Vamos conversar'
  title:
    - text: 'Tem um '
    - text: 'projeto'
      strong: true
    - text: ' em mente?'
  body:
    - 'Adoro conhecer gente nova, trocar experiências e colaborar em projetos interessantes. Se você quer bater um papo sobre desenvolvimento ou tem uma ideia que precisa de uma mão para sair do papel, me manda uma mensagem.'
  social:
    - platform: 'email'
      label: 'contato@adeonir.dev'
      link: 'mailto:contato@adeonir.dev'
    - platform: 'github'
      label: 'github.com/adeonir'
      link: 'https://github.com/adeonir'
    - platform: 'linkedin'
      label: 'linkedin.com/in/adeonir'
      link: 'https://www.linkedin.com/in/adeonir'
    - platform: 'x'
      label: 'x.com/adeonir'
      link: 'https://x.com/adeonir'
  form:
    fields:
      - name: 'name'
        label: 'Nome'
        placeholder: 'Seu nome'
      - name: 'email'
        label: 'Email'
        placeholder: 'voce@exemplo.com'
      - name: 'subject'
        label: 'Assunto'
        placeholder: 'Sobre o que você quer falar?'
      - name: 'message'
        label: 'Mensagem'
        placeholder: 'Conta mais sobre a sua ideia.'
    submit: 'Enviar mensagem'
    states:
      success:
        title: 'Mensagem enviada'
        description: 'Obrigado! Logo eu entro em contato.'
      error:
        title: 'Deu algum problema'
        description: 'Tenta de novo ou me escreve direto no email.'
    validation:
      required: 'Por favor, preencha este campo.'
      email: 'Parece que esse email não está certo. Pode conferir?'
      maxLength: 'Este campo aceita no máximo {max} caracteres.'
