eyebrow: 'Capabilities'
headline:
  - text: 'What I '
  - text: 'do'
    highlight: true
body: 'What I do day to day, and what the team gets from it.'
items:
  - title: 'Artificial intelligence'
    description: 'I use AI agents in structured processes to plan, debug, test, and review. I also build integrations of AI features into interfaces.'
  - title: 'Design systems'
    description: 'I keep the component library organized and documented, so the team can build new screens to the same standard without rewriting what’s already there.'
  - title: 'Accessible interfaces'
    description: 'I work on accessibility from the first component, so the interface also works with keyboard navigation or a screen reader.'
  - title: 'Performance'
    description: 'I care about performance in every screen I build, because a well-made interface also has to load fast and respond without lag.'
