eyebrow: 'About me'
headline:
  - text: 'From '
  - text: 'design'
    highlight: true
  - text: ' to '
  - text: 'code'
    highlight: true
body: 'Where I come from, what I work on today, and what I do beyond that.'
bio:
  - - text: "Hi, I'm Adeonir, and I like building things for the internet. I'm a frontend and design engineer, currently looking for my next opportunity. I explore ideas through prototypes and build functional, accessible interfaces, with an eye for detail. I particularly enjoy working at the intersection of design and code."
  - - text: 'After years as a graphic designer working on advertising materials, books, and magazines, I moved into frontend development. Day to day, I work mainly with React, TypeScript, Next.js, and Tailwind, and I use AI agents in my development workflow.'
  - - text: 'At '
    - text: 'Joyjet'
      href: 'https://joyjet.com/'
    - text: ', a French agency, I was a UI Engineer, working very closely with a designer, and together we planned the features of a PWA where accessibility was a requirement. As a Senior Frontend Developer, I took over legacy projects and designed the architecture for a progressive migration from Vue to React. At '
    - text: 'Jaya Tech'
      href: 'https://jaya.tech/'
    - text: ', a US consulting company, I joined the product team of an insurance company as a Frontend Engineer, and helped maintain the component library and the web platform. Beyond that, I contributed to financial products, business management platforms, and systems that investigate creditors and recover assets.'
  - - text: 'Outside of work, I build a few personal projects where I design the interface and define the architecture, and get to practice backend and mobile development too.'
  - - text: 'In my spare time, I like spending time with family, collecting Hot Wheels with my son, watching TV shows and movies, and hanging out with friends.'
