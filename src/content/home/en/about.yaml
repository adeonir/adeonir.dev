body: 'Who I am, where I come from, and what I do.'
bio:
  - - text: "Hi, I'm Adeonir, and I like building things for the internet. As a frontend and design engineer, I'm looking for my next opportunity. I explore ideas through prototypes, create functional and accessible interfaces, build component libraries and design systems. I especially enjoy working at the intersection of design and code, always with an eye for detail."
  - - text: 'After more than a decade as a graphic designer working on advertising materials, books, and magazines, I moved into frontend development. Day to day, I work mainly with React, TypeScript, Next.js, and Tailwind, and I use AI agents like Claude Code and Codex across the whole cycle, from specs and planning to implementation and review. I work in English at a professional level and have collaborated with teams in Europe and the US.'
  - - text: 'Outside of work, I build a few personal projects where I design the interface and define the architecture, and get to practice backend and mobile development too.'
  - - text: 'In my spare time, I like spending time with family, collecting Hot Wheels with my son, watching TV shows and movies, and hanging out with friends.'
