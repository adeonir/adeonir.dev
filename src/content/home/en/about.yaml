eyebrow: 'About me'
headline:
  - text: 'From '
  - text: 'design'
    highlight: true
  - text: ' to '
  - text: 'code'
    highlight: true
body: 'Where I come from, what I work on today, and what I get up to beyond that.'
bio:
  - - text: "Hi, I'm Adeonir, and I like building things for the internet. I work as a frontend engineer, and the part I'm most drawn to is design engineering. I test ideas in prototypes and build functional, accessible interfaces, always keeping an eye on the details. I particularly enjoy working at the intersection of design and code."
  - - text: 'I was a Frontend Engineer at '
    - text: 'Jaya Tech'
      href: 'https://jaya.tech/'
    - text: ', on the product team at '
    - text: 'The Zebra'
      href: 'https://www.thezebra.com/'
    - text: ', a US car insurance company, where I worked on the design system library and the web platform. I mainly used React and TypeScript, working with designers, developers, and product managers.'
  - - text: "After years as a graphic designer creating advertising materials, books, and magazines, I moved into frontend development. Since then, I've worked on financial products, business management platforms, and creditor investigation and asset recovery systems."
  - - text: 'I worked for a while at '
    - text: 'Joyjet'
      href: 'https://joyjet.com/'
    - text: ', an agency in France. I started as a UI Engineer, then as Lead UI Engineer, leading UI implementation decisions and mentoring a junior developer. As a Senior Frontend Developer, I took over a legacy Vue and Express project and defined the frontend architecture for its progressive migration from Vue to React.'
  - - text: 'Outside of work, I build a few personal projects where I decide the visual design and the architecture, and also apply my knowledge of backend and mobile development. These experiences shaped how I think about building interfaces.'
  - - text: 'In my spare time, I like spending time with family, collecting Hot Wheels with my son, watching TV shows and movies, and hanging out with friends.'
