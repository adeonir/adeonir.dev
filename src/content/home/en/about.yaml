body: 'Where I come from, what I work on today, and what I do beyond that.'
bio:
  - - text: "Hi, I'm Adeonir, and I like building things for the internet. I'm a frontend and design engineer, currently looking for my next opportunity. I explore ideas through prototypes and craft functional, accessible interfaces, building the component libraries and design systems behind them. I particularly enjoy working at the intersection of design and code, with an eye for detail."
  - - text: 'After more than a decade as a graphic designer working on advertising materials, books, and magazines, I moved into frontend development. Day to day, I work mainly with React, TypeScript, Next.js, and Tailwind, and I use AI agents like Claude Code and Codex across the whole cycle, from specs and planning to implementation and review. I work in English with professional working proficiency and have collaborated with teams in Europe and the US.'
  - - text: 'Outside of work, I build a few personal projects where I design the interface and define the architecture, and get to practice backend and mobile development too.'
  - - text: 'In my spare time, I like spending time with family, collecting Hot Wheels with my son, watching TV shows and movies, and hanging out with friends.'
