eyebrow: 'Sobre mim'
headline:
  - text: 'Do '
  - text: 'design '
    highlight: true
  - text: 'ao '
  - text: 'código'
    highlight: true
body: 'De onde eu venho, no que trabalho hoje e o que faço além disso.'
bio:
  - - text: 'Olá, sou Adeonir e gosto de criar coisas para a internet. Sou frontend e design engineer, e estou em busca da próxima oportunidade. Exploro ideias em protótipos e crio interfaces funcionais e acessíveis, construindo as bibliotecas de componentes e design systems por trás delas. Gosto especialmente de trabalhar na interseção entre design e código, sempre de olho nos detalhes.'
  - - text: 'Depois de mais de uma década como designer gráfico, criando materiais publicitários, livros e revistas, migrei para o desenvolvimento frontend. No dia a dia eu trabalho principalmente com React, TypeScript, Next.js e Tailwind, e uso agentes de IA como Claude Code e Codex em todo o ciclo, da especificação e planejamento à implementação e revisão.'
  - - text: 'Na '
    - text: 'Joyjet'
      href: 'https://joyjet.com/'
    - text: ', uma agência da França, trabalhei como UI Engineer, ficando muito próximo do designer, e juntos planejamos as funcionalidades de um PWA que tinha a acessibilidade como requisito. Como Senior Frontend Developer, assumi projetos legados e desenhei a arquitetura de uma migração progressiva de Vue para React. Na '
    - text: 'Jaya Tech'
      href: 'https://jaya.tech/'
    - text: ', uma consultoria dos Estados Unidos, entrei no time de produto de uma seguradora como Frontend Engineer, e ajudei a manter a biblioteca de componentes e a plataforma web. Além disso, colaborei em produtos financeiros, plataformas de gestão empresarial e sistemas que investigam credores e recuperam ativos.'
  - - text: 'Fora do trabalho, desenvolvo alguns projetos pessoais, onde desenho a interface e defino a arquitetura, e também aplico meus conhecimentos em backend e desenvolvimento mobile.'
  - - text: 'No meu tempo livre, gosto de ficar com a família, colecionar miniaturas de Hot Wheels com meu filho, assistir a séries e filmes e curtir com amigos.'
