eyebrow: 'Sobre mim'
headline:
  - text: 'Do '
  - text: 'design '
    highlight: true
  - text: 'ao '
  - text: 'código'
    highlight: true
body: 'De onde eu venho, no que trabalho hoje e o que faço além disso.'
bio:
  - - text: 'Olá, sou Adeonir e gosto de criar coisas para a internet. Trabalho como frontend engineer, e a parte que mais me interessa é o design engineering. Testo ideias em protótipo e crio interfaces funcionais e acessíveis, sempre de olho nos detalhes. Gosto especialmente de trabalhar na interseção entre design e código.'
  - - text: 'Fui Frontend Engineer na '
    - text: 'Jaya Tech'
      href: 'https://jaya.tech/'
    - text: ', no time de produto da '
    - text: 'The Zebra'
      href: 'https://www.thezebra.com/'
    - text: ', uma empresa americana de seguros de automóveis, onde trabalhei na biblioteca do design system e na plataforma web. Usei principalmente React e TypeScript, junto com designers, desenvolvedores e product managers.'
  - - text: 'Depois de anos como designer gráfico, criando materiais publicitários, livros e revistas, migrei para o desenvolvimento frontend. Desde então, trabalhei com produtos financeiros, plataformas de gestão empresarial e sistemas de investigação de credores e recuperação de ativos.'
  - - text: 'Trabalhei por um período na '
    - text: 'Joyjet'
      href: 'https://joyjet.com/'
    - text: ', uma agência na França. Comecei como UI Engineer e depois como Lead UI Engineer, liderando as decisões de implementação de UI e mentorando um desenvolvedor júnior. Como Senior Frontend Developer, assumi um projeto legado em Vue e Express e defini a arquitetura do frontend para a migração progressiva de Vue para React.'
  - - text: 'Fora do trabalho, desenvolvo alguns projetos pessoais, onde decido o design visual e a arquitetura, e aplico também meus conhecimentos em backend e desenvolvimento mobile. Essas experiências moldaram o jeito como penso ao construir interfaces.'
  - - text: 'No meu tempo livre, gosto de ficar com a família, colecionar miniaturas de Hot Wheels com meu filho, assistir a séries e filmes e curtir com amigos.'
