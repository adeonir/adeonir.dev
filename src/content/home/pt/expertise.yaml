eyebrow: 'Especialidades'
headline:
  - text: 'O que eu '
  - text: 'faço'
    highlight: true
body: 'O que eu faço no dia a dia, e o que o time ganha com isso.'
items:
  - title: 'Interfaces acessíveis'
    description: 'Faço interfaces que funcionam bem em diferentes tamanhos, com semântica correta e acessibilidade desde o começo.'
  - title: 'Design systems'
    description: 'Deixo a biblioteca organizada e documentada para o time montar novas telas com o mesmo padrão, sem reescrever o que já existe.'
  - title: 'Estado e dados'
    description: 'Faço integração de API e gerenciamento de estado, com cache e dados compartilhados entre as telas.'
  - title: 'Qualidade e testes'
    description: 'Uso testes automatizados para cobrir o comportamento do produto e acompanho erros e performance depois que ele está no ar.'
  - title: 'Desenvolvimento assistido por IA'
    description: 'Uso agentes de IA em processos estruturados: pesquisa, definição da intenção, especificação, planejamento, implementação e testes. Avalio e ajusto o trabalho ao longo do caminho.'
