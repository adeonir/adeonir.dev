about:
  eyebrow: 'Sobre mim'
  headline:
    - text: 'Do '
    - text: 'design '
      strong: true
      break: true
    - text: 'ao '
    - text: 'código'
      strong: true
    - text: '.'
  bio:
    - 'Depois de anos como designer gráfico, migrei para o código — e isso não foi um desvio, foi uma evolução natural que me trouxe exatamente para onde design e engenharia se encontram. Sou desenvolvedor frontend há mais de 6 anos, trabalhando para empresas no Brasil, na Europa e, mais recentemente, nos EUA. Nos projetos que toco sozinho, coloco a mão na massa no design e no código, de ponta a ponta.'
    - 'Atualmente estou me aprofundando em product engineering e trazendo isso para os meus projetos — assumindo mais do produto do que apenas a interface.'
    - 'Eu trabalho com AI-assisted e agentic workflows para o trabalho pesado, sempre sob minha supervisão (HITL - Human in the loop). Isso me permite avançar rápido sem abrir mão de qualidade e bom senso.'
