about:
  eyebrow: 'Sobre mim'
  headline:
    - text: 'Do '
    - text: 'design '
      highlight: true
    - text: 'ao '
    - text: 'código'
      highlight: true
    - text: '.'
  bio:
    - - text: 'Olá, sou Adeonir e gosto de criar coisas para a internet. Sou design engineer e crio interfaces atraentes e funcionais, com atenção aos detalhes. Gosto especialmente de trabalhar na interseção entre design e código.'
    - - text: 'Atualmente sou Frontend Engineer na '
      - text: 'Jaya Tech'
        href: 'https://jaya.tech/'
      - text: ', trabalhando com clientes nos Estados Unidos. Trabalho principalmente com React e TypeScript, desenvolvendo a biblioteca do design system e a plataforma web. Trabalho ao lado de designers e desenvolvedores para atender às necessidades dos usuários.'
    - - text: 'Depois de anos como designer gráfico, criando materiais publicitários, livros e revistas, migrei para o desenvolvimento frontend. Desde então, trabalhei com produtos financeiros, plataformas de gestão empresarial e sistemas de recuperação de crédito.'
    - - text: 'Trabalhei por um período na '
      - text: 'Joyjet'
        href: 'https://joyjet.com/'
      - text: ', uma agência na França. Como UI Engineer, coordenei a equipe de UI Design e liderei dois desenvolvedores juniores. Mais tarde, como Frontend Developer, assumi um projeto legado em Vue e Express e reescrevi em React.'
    - - text: 'Fora do trabalho, também desenvolvo projetos pessoais, principalmente landing pages. Essas experiências moldaram o jeito como penso ao construir interfaces.'
    - - text: 'No meu tempo livre, gosto de ficar com a família, colecionar miniaturas de Hot Wheels com meu filho, assistir a séries e filmes e curtir com amigos.'
