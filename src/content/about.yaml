about:
  eyebrow: 'Sobre mim'
  headline:
    - text: 'Do '
    - text: 'design '
      strong: true
      break: true
    - text: 'ao '
    - text: 'código'
      strong: true
    - text: '.'
  bio:
    - 'Depois de anos como designer gráfico, migrei para o desenvolvimento numa evolução natural que me colocou exatamente onde design e código se encontram. Sou desenvolvedor frontend há mais de 6 anos, trabalhando para empresas no Brasil, na Europa e, mais recentemente, nos EUA. Nos projetos que toco sozinho, cuido do código de ponta a ponta, e também do design quando preciso.'
    - 'Atualmente estou me aprofundando em product engineering e levando esse conhecimento para os meus projetos, indo além da interface.'
    - 'Eu uso ferramentas de IA e fluxos agênticos para o trabalho pesado, sempre sob minha supervisão (HITL - Human in the loop). Isso me permite avançar rápido sem abrir mão de qualidade e bom senso.'
