about:
  eyebrow: 'Sobre mim'
  headline:
    - text: 'Do '
    - text: 'design '
      highlight: true
    - text: 'ao '
    - text: 'código'
      highlight: true
    - text: '.'
  bio:
    - 'Olá, sou Adeonir e gosto de desenvolver coisas para a internet. Eu sou design engineer e crio interfaces atraentes e funcionais, com atenção aos detalhes. Onde eu mais gosto de trabalhar é na interseção entre design e código.'
    - 'Atualmente sou Frontend Engineer na Jaya Tech e atuo em clientes norte-americanos. Trabalho principalmente com React e TypeScript, mantendo e evoluindo a biblioteca do design system e a plataforma web. Faço isso junto com designers e desenvolvedores, para atender às necessidades dos usuários.'
    - 'Depois de anos atuando como designer gráfico e criando materiais publicitários, livros e revistas, migrei para o desenvolvimento, mais especificamente para o frontend. Desde então trabalhei com produtos financeiros, plataformas de gestão para empresas e sistemas de recuperação de crédito. Trabalhei por um período numa agência na França, onde reescrevi um projeto legado em Vue e Express para React sem tirar o serviço do ar, e coordenei o time de UI Design liderando dois desenvolvedores juniores. Fora do trabalho, faço projetos pessoais, principalmente landing pages. Todas essas experiências mudaram o jeito como penso em construir uma interface.'
    - 'No meu tempo livre, gosto de ficar com a família, colecionar miniaturas de Hot Wheels com meu filho, assistir séries e filmes, e curtir com amigos.'
