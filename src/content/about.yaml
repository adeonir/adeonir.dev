about:
  eyebrow: 'Sobre mim'
  headline:
    - text: 'Do '
    - text: 'design '
      highlight: true
    - text: 'ao '
      break: true
    - text: 'código'
      highlight: true
    - text: '.'
  bio:
    - 'Olá, sou Adeonir e gosto de desenvolver para a web. Sou design engineer e crio interfaces atraentes e funcionais, com atenção aos detalhes. É na interseção entre design e código que mais gosto de trabalhar.'
    - 'Atualmente sou Frontend Engineer na Jaya Tech e trabalho com clientes norte-americanos. Trabalho principalmente com React e TypeScript. Mantenho e evoluo a biblioteca do design system e a plataforma web, em parceria com designers e desenvolvedores, para atender às necessidades dos usuários.'
    - 'Depois de anos atuando como designer gráfico e criando materiais publicitários, livros e revistas, migrei para o desenvolvimento. No Brasil, trabalhei com produtos financeiros, plataformas de gestão para empresas e sistemas de recuperação de crédito. Mais recentemente, trabalhei em uma agência na França. Lá, reescrevi um projeto legado em Vue e Express para React sem tirar o serviço do ar, liderei dois desenvolvedores e coordenei o time de UI Design. Fora do trabalho, também faço alguns projetos pessoais, principalmente landing pages e sites de e-commerce. Todas essas experiências mudaram o jeito como penso em construir uma interface.'
    - 'No meu tempo livre, gosto de ficar com a família, colecionar miniaturas de Hot Wheels com meu filho, assistir séries e filmes, e curtir com amigos.'
