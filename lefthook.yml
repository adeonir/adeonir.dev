glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "src/**/*.{js,mjs,cjs,ts,tsx,jsx,json,jsonc,css}"
      run: pnpm exec biome check --write --unsafe --no-errors-on-unmatched --error-on-warnings {staged_files}
      stage_fixed: true
    - name: prettier
      glob: "src/**/*.{astro,yaml,yml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
